<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Уровни игры</title>
<!-- Приложение на телефоне (LevelEditorSync_Plan.md §7, этап 4): иконка на главном экране, открывается без сети (sw.js). -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2f6fde">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<!-- Страница уровней (Bootstrap/Docs/LevelEditorWeb_Plan.md §5). С Unity: Tools → Levels → Open Level Editor. Без Unity (телефон, GitHub Pages): LevelEditorSync_Plan.md §7. -->
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --line: #e2e5ea; --text: #1d2330; --muted: #6b7280; --accent: #2f6fde;
  --hard: #fde3e3; --hard-line: #f2b8b8; --blevel: #fff4cc; --blevel-line: #ecd98a; --unlock: #e6effd; --unlock-line: #b9cff3;
  --warn: #b45309; --warn-bg: #fff7e6; --err: #c0392b; --ok: #2e7d32; --chip: #eef1f6; --input: #ffffff;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15181e; --panel: #1d2128; --line: #2e343e; --text: #e6e8ec; --muted: #9aa3b2; --accent: #6ea0ff;
    --hard: #3d2427; --hard-line: #6b3a3f; --blevel: #3b3420; --blevel-line: #6b5d2c; --unlock: #1c2a40; --unlock-line: #2f4a72;
    --warn: #f0b45a; --warn-bg: #3a2f1c; --err: #ff7b6b; --ok: #7ccf83; --chip: #2a303a; --input: #181b21;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
header h1 { font-size: 17px; margin: 0 8px 0 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 6px; background: var(--muted); }
.dot.on { background: var(--ok); } .dot.off { background: var(--err); } .dot.play { background: var(--warn); }
.status { color: var(--muted); font-size: 13px; }
.spacer { flex: 1; }
button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 7px; padding: 5px 10px; cursor: pointer; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.small { padding: 2px 8px; font-size: 12px; }
button.danger:hover { border-color: var(--err); color: var(--err); }
button:disabled { opacity: .35; cursor: default; }
.chips { display: flex; gap: 4px; }
.chips button.on { background: var(--chip); border-color: var(--accent); }
main { padding: 12px 16px 60px; max-width: 1400px; margin: 0 auto; }
.banner { padding: 10px 14px; border-radius: 8px; margin-bottom: 10px; background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); }
.banner.err { color: var(--err); border-color: var(--err); background: transparent; }
/* overflow: clip, не hidden: hidden делает таблицу контейнером прокрутки и ломает sticky-шапку. */
.table { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: clip; }
.row { display: grid; grid-template-columns: 30px 50px 92px 56px minmax(200px, 3fr) 120px 56px 130px 64px 92px 150px; align-items: center; border-top: 1px solid var(--line); }
.row > div { padding: 7px 8px; overflow: hidden; text-overflow: ellipsis; }
.row.head { border-top: 0; font-weight: 600; color: var(--muted); font-size: 12px; background: var(--chip); position: sticky; top: var(--hdr, 53px); z-index: 4; }
.row.level { cursor: pointer; }
.row.level.hard { background: var(--hard); }
.row.open { box-shadow: inset 3px 0 0 var(--accent); }
.handle { cursor: grab; color: var(--muted); text-align: center; user-select: none; touch-action: none; font-size: 16px; padding: 7px 0 !important; }
body.dragging-now, body.dragging-now * { cursor: grabbing !important; user-select: none; }
.handle:active { cursor: grabbing; }
.seq.dragging { opacity: .45; }
.seq.drop-before { box-shadow: inset 0 3px 0 var(--accent); }
.seq.drop-after { box-shadow: inset 0 -3px 0 var(--accent); }
.num { font-weight: 700; font-size: 15px; }
.c { text-align: center; }
.tasks-cell { font-size: 13px; }
.tasks-cell .sub { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tasks-cell .sub b { color: var(--muted); font-weight: 600; margin-right: 4px; }
.state { font-size: 12px; color: var(--muted); white-space: nowrap; }
.state.saved { color: var(--ok); } .state.conflict, .state.error { color: var(--err); } .state.edited, .state.saving, .state.pending { color: var(--warn); }
.badge { display: inline-block; border-radius: 6px; padding: 0 6px; font-size: 12px; background: var(--chip); }
.badge.hard { background: var(--hard-line); }
.issues-n { color: var(--warn); font-size: 12px; margin-left: 4px; }
.mv { display: inline-flex; gap: 2px; margin-left: 6px; }
.mv button { padding: 0 6px; font-size: 12px; line-height: 18px; }
/* Открытие способности и бонусный уровень — строки той же ленты. */
.line { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding: 6px 10px 6px 0; font-size: 13px; }
.line .handle { width: 30px; flex: none; }
.line.unlock { background: var(--unlock); }
.line.bonus { background: var(--blevel); cursor: pointer; }
.line select { width: auto; max-width: 230px; }
.line .what { font-weight: 600; }
.line .muted, .muted { color: var(--muted); }
.editor { border-top: 1px solid var(--line); padding: 14px 16px 18px; background: var(--bg); }
.editor.hard { background: color-mix(in srgb, var(--hard) 55%, var(--bg)); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
fieldset { border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px 12px; margin: 0; background: var(--panel); min-width: 0; }
legend { font-weight: 600; padding: 0 4px; }
label.f { display: grid; grid-template-columns: 1fr 120px; gap: 8px; align-items: center; margin-top: 6px; font-size: 13px; }
label.f.wide { grid-template-columns: 1fr; }
label.f.auto { grid-template-columns: 1fr auto; }
label.f span small { color: var(--muted); display: block; font-size: 11px; }
input, select, textarea { font: inherit; color: var(--text); background: var(--input); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; width: 100%; min-width: 0; }
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--accent) 40%, transparent); border-color: var(--accent); }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.stars-preview { margin-top: 10px; font-size: 13px; color: var(--muted); }
.stars-preview b { color: var(--text); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 4px 12px; }
.seg button.on { background: var(--accent); color: #fff; }
.seg button.on.hard { background: var(--err); }
.subs { margin-top: 12px; display: grid; gap: 10px; }
.sublevel { border: 1px solid var(--line); border-radius: 9px; background: var(--panel); padding: 10px 12px; }
.sublevel-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 6px; }
.sublevel-head h4 { margin: 0; font-size: 14px; }
.sublevel-head select { width: auto; }
.task { display: grid; grid-template-columns: 220px 1fr auto; gap: 8px; align-items: start; padding: 7px 0; border-top: 1px dashed var(--line); }
.task:first-of-type { border-top: 0; }
.task-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px 10px; }
.task-fields label { font-size: 12px; color: var(--muted); display: grid; gap: 2px; }
/* Выбор задания и обучения: под списком — что выбрано, «?» — все варианты с пояснением (нажать — выбрать). */
.task-pick { display: grid; gap: 0; min-width: 0; }
.pick-row { display: flex; gap: 6px; align-items: center; min-width: 0; }
.help-btn { flex: none; width: 22px; height: 22px; padding: 0; border-radius: 50%; font-size: 12px; font-weight: 700; line-height: 20px; }
.help-btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
.hint { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.35; }
.choices { display: grid; gap: 2px; margin-top: 6px; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.choices h5 { margin: 6px 8px 2px; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.choice { display: grid; gap: 1px; text-align: left; border-color: transparent; background: transparent; padding: 5px 8px; }
.choice:hover { background: var(--panel); }
.choice.on { border-color: var(--accent); background: var(--panel); }
.choice span { font-size: 12px; color: var(--muted); }
.task > .choices { grid-column: 1 / -1; }
.line-help { padding: 0 12px 8px 40px; background: var(--unlock); }
.line-help .choices { margin-top: 0; }
.asset { font-size: 13px; }
.asset .chip { display: inline-block; background: var(--chip); border-radius: 6px; padding: 1px 7px; margin-right: 6px; }
.rewards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.reward { border: 1px solid var(--blevel-line); border-radius: 9px; background: var(--panel); padding: 8px; display: grid; gap: 6px; }
.reward-head { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.reward-head .handle { padding: 2px 8px !important; margin-left: -6px; border-radius: 6px; }
.reward-head .handle:hover { background: var(--chip); }
.reward.empty { border-style: dashed; place-items: center; min-height: 92px; }
.reward.drop { outline: 2px solid var(--accent); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
.toolbar input { width: 70px; }
.notes { margin-top: 12px; display: grid; gap: 6px; }
.note { font-size: 13px; padding: 6px 10px; border-radius: 7px; background: var(--warn-bg); color: var(--warn); }
.note.err { color: var(--err); border: 1px solid var(--err); background: transparent; }
.paths { margin-top: 10px; color: var(--muted); font-size: 12px; }
.empty { padding: 30px; text-align: center; color: var(--muted); }
.legend { display: flex; gap: 10px; font-size: 12px; color: var(--muted); margin: 0 0 10px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid var(--line); }
.busy { position: fixed; right: 16px; bottom: 16px; background: var(--panel); border: 1px solid var(--accent); border-radius: 8px; padding: 8px 12px; z-index: 9; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 16px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 14px; z-index: 9; max-width: 90vw; }
.toast.err { border-color: var(--err); color: var(--err); }
.flash { animation: flash 1.2s ease-out; }
@keyframes flash { from { box-shadow: inset 0 0 0 3px var(--accent); } to { box-shadow: none; } }
/* GitHub (LevelEditorSync_Plan.md §5–6): полоса под шапкой — состояние, «Получить / Отправить», конфликты. */
.gh { max-width: 1400px; margin: 10px auto 0; padding: 0 16px; display: grid; gap: 8px; }
.gh-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
.gh-bar b { font-weight: 600; }
.gh-bar a { color: var(--accent); }
.gh-bar .pending { color: var(--warn); }
.gh-bar details { width: 100%; color: var(--muted); }
.gh-bar details summary { cursor: pointer; }
.gh-conflict { border: 1px solid var(--err); border-radius: 10px; padding: 8px 12px; background: var(--panel); font-size: 13px; }
.gh-conflict b { color: var(--err); }
.gh-conflict ul { margin: 6px 0; padding-left: 18px; }
.gh-conflict .muted { font-size: 12px; }
@media (max-width: 1000px) {
  /* Узкий экран (телефон): шапка в три ряда кнопок — не прилипает, иначе закрывает треть экрана. */
  header { position: static; }
  .row { grid-template-columns: 30px 44px 1fr 150px; }
  .row > .hide-s { display: none; }
  .row.head { top: 0; position: static; }
  .task { grid-template-columns: 1fr; }
  .rewards { grid-template-columns: 1fr; }
}
</style>
</head>

<header>
  <h1>Уровни</h1>
  <span class="status" id="conn"><span class="dot"></span>подключение…</span>
  <span class="spacer"></span>
  <div class="chips" id="filters">
    <button data-action="filter" data-filter="all" class="on">Все</button>

    <button data-action="filter" data-filter="issues">С замечаниями</button>

  <button data-action="collapse">Свернуть все</button>
  <button data-action="add-unlock" title="Способность (бустер, помощник, механика шаров), которая открывается с уровня">+ Открытие</button>
  <button data-action="add-bonus" title="Бонусный уровень: 9 наград, игрок берёт несколько">+ Бонусный уровень</button>

</header>
<section id="gh" class="gh" hidden></section>
<main id="app"><div class="empty">Загрузка…</div></main>

    [/^подуровень (\d+): нет заданий$/, (m) => `sub-level ${m[1]}: no tasks`],
    [/^подуровень (\d+): у задания в списке не выбран тип$/, (m) => `sub-level ${m[1]}: a task in the list has no type`],
    [/^камней (\d+) при (\d+) объектах на старте — шаров на старте не будет$/, (m) => `${m[1]} stones with ${m[2]} objects at start — no balls at start`],
    [/^камней (\d+) при лимите объектов (\d+) — шаров на старте не будет$/, (m) => `${m[1]} stones with an object limit of ${m[2]} — no balls at start`],
    [/^на старте (\d+) объектов при лимите (\d+) — стартовый бросок урежется до лимита \(шаров меньше\)$/, (m) => `${m[1]} objects at start with a limit of ${m[2]} — the start throw is cut to the limit (fewer balls)`],
    [/^стартовое слово «(.+)» повторяется$/, (m) => `start word “${m[1]}” is repeated`],
    [/^стартовые слова — (\d+) (буква|буквы|букв), а шаров в стартовом броске (\d+): не все буквы будут на сцене сразу$/,
      (m) => `start words have ${m[1]} letter${m[1] === "1" ? "" : "s"}, but the start throw has ${m[3]} balls: not all letters will be on scene at once`],
    [/^(Бустер|Помощник)( «(.+)»)? × (\d+)$/, (m) => `${I18N.tr(m[1])}${m[3] ? ` “${I18N.tr(m[3])}”` : ""} × ${m[4]}`],
    [/^(.+) \(файлов изменено: (\d+)\)$/, (m) => `${I18N.tr(m[1])} (files changed: ${m[2]})`],
    [/^конфликтов: (\d+) — Tools → Levels → GitHub → Настройки или страница уровней$/, (m) => `conflicts: ${m[1]} — Tools → Levels → GitHub → Settings, or the levels page`],
    [/^конфликтов: (\d+)(.*)$/, (m) => `conflicts: ${m[1]}${m[2]}`],
    // различия по полям: «поле: здесь → GitHub»
    [/^(.+?): (.*) → (.*)$/, (m) => `${I18N.tr(m[1])}: ${I18N.value(m[2])} → ${I18N.value(m[3])}`],
  ],

  tr(text) {
    if (I18N.lang === "ru" || !text || !/[А-Яа-яЁё]/.test(text)) return text;
    const lead = text.match(/^\s*/)[0], trail = text.match(/\s*$/)[0];
    const core = text.trim();
    const done = I18N.core(core);
    return done === null ? text : lead + done + trail;
  },
  core(s) {
    if (Object.prototype.hasOwnProperty.call(I18N.EXACT, s)) return I18N.EXACT[s];
    // Сначала части (шаблон с «(.+)» иначе съел бы соседние), потом шаблоны.
    for (const sep of [" · ", "; "]) if (s.includes(sep)) return s.split(sep).map((p) => I18N.tr(p)).join(sep);
    for (const [re, fn] of I18N.PATTERNS) { const m = re.exec(s); if (m) return fn(m); }
    if (s.endsWith("…") && s.length > 1) { const r = I18N.core(s.slice(0, -1)); if (r !== null) return r + "…"; }
    // Перечень через запятую (награды бонусного уровня) — только если переводится каждая часть.
    if (s.includes(", ")) {
      const parts = s.split(", ").map((p) => (/[А-Яа-яЁё]/.test(p) ? I18N.core(p) : p));
      if (parts.every((p) => p !== null)) return parts.join(", ");
    }
    return null;
  },
  parts(s, sep) { return s.split(sep || "; ").map((p) => (sep ? I18N.tr(p) : I18N.parts(p, ", "))).join(sep || "; "); },
  value(v) { return v === "нет" ? "none" : v === "есть" ? "present" : v; },

  // DOM: исходный русский текст помнится у узла — смена языка в обе стороны без перерисовки.
  ORIG: new WeakMap(),
  ATTRS: ["title", "placeholder", "label"],
  text(node) {
    const p = node.parentNode;
    if (!p || p.nodeName === "SCRIPT" || p.nodeName === "STYLE") return;
    const known = I18N.ORIG.get(node);
    const ru = known && known.shown === node.nodeValue ? known.ru : node.nodeValue;
    const shown = I18N.tr(ru);
    I18N.ORIG.set(node, { ru, shown });
    if (node.nodeValue !== shown) node.nodeValue = shown;
  },
  attrs(el) {
    let known = I18N.ORIG.get(el);
    for (const a of I18N.ATTRS) {
      if (!el.hasAttribute(a)) continue;
      known = known || {};
      const cur = el.getAttribute(a), k = known[a];
      const ru = k && k.shown === cur ? k.ru : cur;
      const shown = I18N.tr(ru);
      known[a] = { ru, shown };
      if (cur !== shown) el.setAttribute(a, shown);
    }
    if (known) I18N.ORIG.set(el, known);
  },
  walk(root) {
    if (root.nodeType === 3) { I18N.text(root); return; }
    if (root.nodeType !== 1) return;
    I18N.attrs(root);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
    for (let n = w.nextNode(); n; n = w.nextNode()) n.nodeType === 3 ? I18N.text(n) : I18N.attrs(n);
  },
  set(lang) {
    I18N.lang = lang === "en" ? "en" : "ru";
    try { localStorage.setItem("level-editor.lang", I18N.lang); } catch { /* приватный режим — только на сейчас */ }
    document.documentElement.lang = I18N.lang;
    I18N.walk(document.documentElement);
    const btn = document.getElementById("lang-btn");
    if (btn) btn.textContent = I18N.lang === "ru" ? "EN" : "RU";
  },
  init() {
    let saved = null;
    try { saved = localStorage.getItem("level-editor.lang"); } catch { /* нет хранилища */ }
    I18N.lang = saved === "en" || saved === "ru" ? saved : "ru";
    new MutationObserver((records) => {
      for (const r of records) {
        if (r.type === "characterData") I18N.text(r.target);
        else if (r.type === "attributes") I18N.attrs(r.target);
        else for (const n of r.addedNodes) I18N.walk(n);
      }
    }).observe(document.documentElement, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: I18N.ATTRS });
    const nativeConfirm = window.confirm.bind(window);
    window.confirm = (message) => nativeConfirm(I18N.tr(message));
    I18N.set(I18N.lang);
  },
};
I18N.init();

// ───────────────────────── данные ─────────────────────────
// Уровень L: key «L3», n, file, hash, server, draft, issues, messages, status, dirty, saving, version, timer, conflict, error.
// Развитие игры P (Progression.json): unlocks (открытия способностей) и bonusLevels (бонусные уровни-награды) — один файл.
const S = {
  state: null,
  levels: new Map(),
  prog: null,
  open: new Set(),      // раскрытые: «L3», «B5» (бонусный после уровня 5)
  help: new Set(),      // открытые «?» у выбора задания / обучения: id их списка
  filter: "all",
  online: null,
  playing: false,
  idle: false,
  busyOp: false,
  drag: null,           // { kind: "level" | "unlock" | "bonus" | "reward", n, feature, slot }
};

const ORDER_NAMES = { Together: "Вместе", InOrder: "По одному" };
const FIELD_LABELS = {
  _points: "Очки", _text: "Текст для игрока", _letter: "Буква", _times: "Сколько раз",
  _letters: "Букв в слове", _words: "Сколько слов", _stones: "Сколько камней",
  _minOnScene: "На сцене не меньше (0 — общий блок)", _maxOnScene: "На сцене не больше (0 — общий блок)",
  _wordsOnScene: "Готовых слов на сцене (0 — общий блок)",
};
const REWARD_NAMES = { Coins: "Монеты", Booster: "Бустер", Helper: "Помощник", InfiniteLives: "Бесконечные жизни" };
const REWARD_UNITS = { Coins: "монет", Booster: "шт.", Helper: "шт.", InfiniteLives: "мин" };
const ITEM_NAMES = { LongestWord: "Длинное слово", Multiplier: "x2", BreakAll: "Очистка поля", AddLetters: "Новые буквы", Wildcard: "Джокер *" };
const STATUS_TEXT = { saved: "сохранено", edited: "изменено…", saving: "сохраняется…", conflict: "конфликт", error: "ошибка", offline: "нет связи", pending: "в файле · ждёт Unity" };
// 9 наград нового бонусного уровня — потом правятся.
const DEFAULT_REWARDS = [
  { kind: "Coins", item: "", amount: 50 }, { kind: "Coins", item: "", amount: 100 }, { kind: "Coins", item: "", amount: 200 },
  { kind: "Booster", item: "LongestWord", amount: 1 }, { kind: "Booster", item: "Multiplier", amount: 1 }, { kind: "Booster", item: "BreakAll", amount: 1 },
  { kind: "Helper", item: "AddLetters", amount: 1 }, { kind: "Helper", item: "Wildcard", amount: 1 }, { kind: "InfiniteLives", item: "", amount: 30 },
];

const clone = (o) => JSON.parse(JSON.stringify(o));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const app = document.getElementById("app");
// Без Unity (телефон, GitHub Pages): адреса /api/... выполняет сама страница (Local ниже), данные — в IndexedDB.
// Проверить на компьютере: ?standalone в адресе.
const STANDALONE = !["localhost", "127.0.0.1", "[::1]"].includes(location.hostname) || new URLSearchParams(location.search).has("standalone");

async function api(method, url, body) {
  if (STANDALONE) return Local.api(method, url, body);
  const opts = { method, headers: {} };
  if (method !== "GET") opts.headers["X-Level-Editor"] = "1";
  if (body !== undefined) { opts.headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(body); }
  const r = await fetch(url, opts);
  let json = null;
  try { json = await r.json(); } catch { json = {}; }
  return { ok: r.ok, status: r.status, body: json };
}

function taskType(name) { return (S.state?.taskTypes || []).find((t) => t.type === name); }

// ── Выбор задания и обучения: название, пояснение, «?» со всеми вариантами ──
// Пояснения — из schema.json / Unity (LockTaskMenu → Hint, LevelTutorialKind → [InspectorName] + [ChoiceHint]);
// старый schema.json без них — названия как раньше, пояснений нет.
function tutorialChoices() {
  const info = S.state?.tutorialInfo || [];
  return (S.state?.tutorials || []).map((name) => {
    const i = info.find((x) => x.name === name);
    return { value: name, title: i?.title || (name === "None" ? "Нет" : name), hint: i?.hint || "" };
  });
}
function taskChoices() {
  return (S.state?.taskTypes || []).map((t) => {
    const path = String(t.menu || t.type).split("/");
    return { value: t.type, title: path.pop(), group: path.join("/"), hint: t.hint || "", path: t.menu || t.type };
  }).sort((a, b) => (!!a.group - !!b.group) || a.path.localeCompare(b.path, "ru")); // без группы — первыми
}
// <option>; подряд идущие варианты одной группы — в <optgroup>.
function choiceOptions(items, current) {
  let html = "", group = null;
  for (const i of items) {
    const g = i.group || "";
    if (g !== group) { if (group) html += "</optgroup>"; if (g) html += `<optgroup label="${esc(g)}">`; group = g; }
    html += `<option value="${esc(i.value)}" ${i.value === current ? "selected" : ""} ${i.hint ? `title="${esc(i.hint)}"` : ""}>${esc(i.title)}</option>`;
  }
  if (group) html += "</optgroup>";
  return html;
}
function helpBtn(target) {
  return `<button type="button" class="help-btn ${S.help.has(target) ? "on" : ""}" data-action="help" data-help="${esc(target)}" title="Что это такое — все варианты с пояснением">?</button>`;
}
function hintHtml(items, current) {
  const hint = items.find((i) => i.value === current)?.hint;
  return hint ? `<div class="hint">${esc(hint)}</div>` : "";
}
// Все варианты с пояснением; нажатие выбирает вариант в списке target (как обычный выбор — событие change).
function choiceList(target, items, current) {
  if (!S.help.has(target)) return "";
  let html = "", group = null;
  for (const i of items) {
    const g = i.group || "";
    if (g !== group) { if (g) html += `<h5>${esc(g)}</h5>`; group = g; }
    html += `<button type="button" class="choice ${i.value === current ? "on" : ""}" data-action="pick" data-target="${esc(target)}" data-value="${esc(i.value)}">
      <b>${esc(i.title)}</b>${i.hint ? `<span>${esc(i.hint)}</span>` : ""}</button>`;
  }
  return `<div class="choices"><div class="hint" style="margin:0 8px 2px">Нажмите вариант, чтобы выбрать его.</div>${html}</div>`;
}
function regular() { return [...S.levels.values()].filter((L) => L.draft).sort((a, b) => a.n - b.n); }
function levelCount() { return regular().length; }
function unlocks() { return S.prog?.draft?.unlocks || []; }
function bonuses() { return S.prog?.draft?.bonusLevels || []; }
function bonusAt(n) { return bonuses().find((b) => b.afterLevel === n); }
function featureInfo(f) { return (S.state?.features || []).find((x) => x.feature === f); }
function rewardSlots() { return S.state?.rewards?.slots || 9; }

function toast(text, err) {
  const el = document.createElement("div");
  el.className = "toast" + (err ? " err" : "");
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), err ? 6000 : 3500);
}

// ───────────────────────── загрузка и опрос ─────────────────────────
function applyEntry(T, e) {
  T.file = e.file;
  T.issues = e.issues || [];
  if (e.error) { T.error = e.error; T.status = "error"; return; }
  if (T.dirty || T.saving) {
    if (e.hash !== T.hash && !T.saving) { T.conflict = { hash: e.hash, data: e.data }; T.status = "conflict"; }
    return;
  }
  // Пока Unity в фоне, то, что сохранено только в файл, остаётся «ждёт Unity».
  const stillPending = S.idle && T.status === "pending" && e.hash === T.hash;
  T.hash = e.hash; T.server = e.data; T.draft = clone(e.data);
  if (T.status !== "error" && !stillPending) T.status = "saved";
}

function applyState(st, reset) {
  S.state = st;
  S.playing = st.playing;
  S.idle = !!st.unityIdle;
  if (reset) { for (const L of S.levels.values()) clearTimeout(L.timer); S.levels = new Map(); }
  const seen = new Set();
  for (const e of st.levels || []) {
    const key = "L" + e.level;
    seen.add(key);
    let L = S.levels.get(key);
    if (!L) { L = { key, kind: "level", n: e.level, version: 0, status: "saved" }; S.levels.set(key, L); }
    applyEntry(L, e);
  }
  for (const [k, L] of S.levels) if (!seen.has(k) && !L.dirty) S.levels.delete(k);
  if (!S.prog) S.prog = { key: "P", kind: "progression", version: 0, status: "saved" };
  if (st.progression && st.progression.data) applyEntry(S.prog, st.progression);
  else if (!S.prog.draft) S.prog.draft = { unlocks: [], bonusLevels: [] };
  setOnline(true);
  render();
}

async function loadState() {
  const r = await api("GET", "/api/state");
  if (!r.ok) throw new Error(r.body.error || r.status);
  applyState(r.body, false);
}

function tracked() { return [...S.levels.values(), S.prog].filter(Boolean); }

async function poll() {
  try {
    if (!S.busyOp && !S.drag) {
      const r = await api("GET", "/api/hashes");
      if (!r.ok) throw new Error();
      setOnline(true);
      const files = r.body.files || {};
      const known = new Map(tracked().filter((T) => T.file && T.hash).map((T) => [T.file, T.hash]));
      let changed = Object.keys(files).length !== known.size;
      for (const [f, h] of Object.entries(files)) if (known.get(f) !== h) changed = true;
      if (changed && !tracked().some((T) => T.saving) && !S.busyOp) await loadState();
    }
  } catch { setOnline(false); }
  setTimeout(poll, 1500);
}

function setOnline(on) {
  S.online = on;
  const el = document.getElementById("conn");
  if (S.state?.standalone) el.innerHTML = '<span class="dot on"></span>Без Unity · сохраняется на этом устройстве';
  else if (!on) el.innerHTML = '<span class="dot off"></span>Unity не отвечает — правки сохранятся, когда он вернётся';
  else if (S.idle) el.innerHTML = '<span class="dot play"></span>Unity в фоне — правки пишутся в файлы, в ассеты попадут, когда окно Unity станет активным';
  else if (S.playing) el.innerHTML = '<span class="dot play"></span>Unity · Play Mode (префабы обновятся после выхода)';
  else el.innerHTML = `<span class="dot on"></span>Unity · ${esc(S.state?.folder || "")}`;
}

// ───────────────────────── сохранение ─────────────────────────
function markDirty(T) {
  T.dirty = true; T.version++; T.status = "edited";
  clearTimeout(T.timer);
  T.timer = setTimeout(() => save(T), 700);
}

async function save(T, overwrite) {
  if (T.saving) { T.pending = true; return; }
  if (T.conflict && !overwrite) { render(); return; }
  clearTimeout(T.timer);
  T.saving = true; T.status = "saving";
  const version = T.version;
  const baseHash = overwrite && T.conflict ? T.conflict.hash : T.hash || null;
  if (T.kind === "level") updateRow(T);
  try {
    const url = T.kind === "progression" ? "/api/progression" : `/api/level/${T.n}`;
    const r = await api("PUT", url, { baseHash, data: T.draft });
    if (r.status === 409) {
      T.conflict = { hash: r.body.hash, data: r.body.data }; T.status = "conflict";
    } else if (!r.ok && r.status !== 422) {
      T.error = r.body.error || `ошибка ${r.status}`; T.status = "error";
    } else {
      T.hash = r.body.hash; T.file = r.body.file; T.server = r.body.data;
      T.issues = r.body.issues || []; T.messages = r.body.messages || [];
      T.conflict = null; T.error = r.body.error || null;
      if (T.version === version) { T.draft = clone(r.body.data); T.dirty = false; T.status = T.error ? "error" : r.body.pending ? "pending" : "saved"; }
      else { T.status = "edited"; T.timer = setTimeout(() => save(T), 400); }
    }
    setOnline(true);
  } catch {
    T.status = "offline"; setOnline(false);
    T.timer = setTimeout(() => save(T), 3000);
  }
  T.saving = false;
  if (T.pending) { T.pending = false; await save(T); }
  render();
}

// Перед переносом и вставкой уровней: несохранённые правки — сохранить (страница и Unity должны видеть одно и то же).
async function flushSaves() {
  for (const T of tracked()) if (T.dirty && !T.conflict) await save(T);
  return !tracked().some((T) => T.dirty || T.saving || T.conflict);
}

// ───────────────────────── уровни: перенос и вставка (Unity переименовывает ассеты) ─────────────────────────
async function op(url, body, remapOpen, done) {
  if (S.busyOp) return;
  if (!(await flushSaves())) { toast("Сначала разберите конфликт или ошибку сохранения", true); return; }
  S.busyOp = true;
  const busy = document.createElement("div");
  busy.className = "busy"; busy.textContent = STANDALONE ? "Переставляю уровни…" : "Unity переименовывает уровни…";
  document.body.appendChild(busy);
  try {
    const r = await api("POST", url, body);
    if (r.status === 503) { toast(r.body.error || "Unity в фоне — сделайте окно Unity активным и повторите", true); return; }
    if (!r.body.levels) { toast(r.body.error || `ошибка ${r.status}`, true); return; }
    if (remapOpen) S.open = new Set([...S.open].map(remapOpen).filter(Boolean));
    applyState(r.body, true);
    const res = r.body.result || {};
    if (res.error) toast("Не получилось: " + res.error, true);
    else { done?.(res); render(); if (res.messages?.length) toast(res.messages.join(" · ")); }
  } catch { toast("Нет связи с Unity", true); setOnline(false); }
  finally { busy.remove(); S.busyOp = false; }
}

// Номер уровня после переноса from → to (остальные сдвигаются).
function shifted(k, from, to) {
  if (k === from) return to;
  if (from < to && k > from && k <= to) return k - 1;
  if (from > to && k >= to && k < from) return k + 1;
  return k;
}

function moveLevel(from, to) {
  const count = levelCount();
  if (to < 1 || to > count || from === to) return;
  op("/api/move", { kind: "level", from, to }, (k) => (k[0] === "L" ? "L" + shifted(+k.slice(1), from, to) : k),
    () => flash(`row-L${to}`));
}

function insertLevel(after) {
  op("/api/insert", { after }, (k) => (k[0] === "L" && +k.slice(1) > after ? "L" + (+k.slice(1) + 1) : k),
    () => { S.open.add("L" + (after + 1)); flash(`row-L${after + 1}`); });
}

function flash(id) {
  setTimeout(() => {
    const el = document.getElementById(id);
    if (!el) return;
    el.scrollIntoView({ block: "center", behavior: "smooth" });
    el.classList.add("flash");
  }, 50);
}

// ───────────────────────── развитие игры: открытия и бонусные уровни (данные Progression.json) ─────────────────────────
function editProg(change) { change(S.prog.draft); markDirty(S.prog); render(); }

function moveUnlock(feature, level) {
  const u = unlocks().find((x) => x.feature === feature);
  level = Math.max(1, Math.min(level, levelCount() + 1));
  if (!u || u.level === level) return;
  editProg(() => { u.level = level; });
  flash(`unlock-${feature}`);
}

function moveBonus(from, to) {
  const b = bonusAt(from);
  if (!b || from === to) return;
  if (to < 1 || to > Math.max(1, levelCount())) { toast("Бонусный уровень стоит после уровня — такого уровня нет", true); return; }
  if (bonusAt(to)) { toast(`После уровня ${to} уже есть бонусный уровень`, true); return; }
  if (S.open.delete("B" + from)) S.open.add("B" + to);
  editProg(() => { b.afterLevel = to; });
  flash(`bonus-${to}`);
}

function addBonus() {
  const last = levelCount();
  let at = 0;
  for (let n = last; n >= 1; n--) if (!bonusAt(n)) { at = n; break; }
  if (!at) { toast("После каждого уровня уже есть бонусный уровень", true); return; }
  editProg((d) => {
    d.bonusLevels.push({ afterLevel: at, picks: S.state?.rewards?.picks || 3, rewards: clone(DEFAULT_REWARDS) });
    d.bonusLevels.sort((a, b) => a.afterLevel - b.afterLevel);
  });
  S.open.add("B" + at);
  render();
  flash(`bonus-${at}`);
  toast(`Бонусный уровень — после уровня ${at}. Перетащите его ⠿ на нужное место.`);
}

function addUnlock() {
  const used = new Set(unlocks().map((u) => u.feature));
  const f = (S.state?.features || []).find((x) => !used.has(x.feature));
  if (!f) { toast("Все способности уже открываются", true); return; }
  const level = Math.min(f.planLevel || 1, levelCount() + 1);
  editProg((d) => { d.unlocks.push({ feature: f.feature, level, title: f.title, tutorial: f.tutorial, showOnMap: f.showOnMap }); });
  flash(`unlock-${f.feature}`);
}

// ───────────────────────── описание для строк ─────────────────────────
function describeTask(t) {
  if (!t || !t.type) return t && t.asset !== undefined && !t.type ? `ассет ${t.name || "?"} (без типа)` : "тип не выбран";
  const s = t.settings || {};
  let text;
  switch (t.type) {
    case "ScorePointsTask": text = `Набрать ${s._points ?? (s._pointsRange ? Math.max(s._pointsRange.x, s._pointsRange.y) : "?")} очков`; break;
    case "UseLetterTask": text = `Буква ${(s._letter || "?").toUpperCase()} × ${s._times}`; break;
    case "ExactLengthWordTask": text = `${s._words > 1 ? s._words + " слова" : "Слово"} из ${s._letters} букв`; break;
    case "MinLengthWordTask": text = `${s._words > 1 ? s._words + " слова" : "Слово"} из ${s._letters}+ букв`; break;
    case "DestroyStonesTask": text = `Разбить ${s._stones} камней`; break;
    case "RepeatLetterWordTask": text = `${s._words > 1 ? s._words + " слова" : "Слово"} из ${s._length} букв, ${s._repeats} одинаковых`; break;
    case "DoubleLetterWordTask": text = `${s._words > 1 ? s._words + " слова" : "Слово"} с двойной буквой`; break;
    case "SameLettersWordTask": text = `${s._words > 1 ? s._words + " слова" : "Слово"} с ${s._repeats} одинаковыми буквами`; break;
    case "VowelsWordTask": text = `${s._words > 1 ? s._words + " слова" : "Слово"} с ${s._vowels}+ гласными`; break;
    default: text = (taskType(t.type)?.menu || t.type).split("/").pop();
  }
  return t.asset ? `${text} ⧉` : text;
}
// Очки ★1 / ★2 / ★3 из одного числа — как LevelConfig.ScoresFor: доли starShares, округление Mathf.RoundToInt
// (float, половина — к чётному), каждая звезда от 1 и больше предыдущей, последняя — ровно число.
function roundHalfEven(x) { const f = Math.floor(x), r = x - f; return r > 0.5 ? f + 1 : r < 0.5 ? f : (f % 2 === 0 ? f : f + 1); }
function starScores(d) {
  const shares = S.state?.starShares || [0.4, 0.75, 1];
  const count = shares.length;
  const total = Math.max(count, d.threeStarScore ?? d.maxScore ?? 300);
  const out = [];
  for (let i = 0; i < count; i++) {
    const raw = i === count - 1 ? total : roundHalfEven(Math.fround(Math.fround(total) * Math.fround(shares[i])));
    const min = i === 0 ? 1 : out[i - 1] + 1;
    const max = total - (count - 1 - i);
    out.push(Math.min(Math.max(raw, min), max));
  }
  return out;
}
function starsPreview(d) {
  const shares = S.state?.starShares || [0.4, 0.75, 1];
  return starScores(d).map((s, i) => `★${i + 1} <b>${s}</b> <small>(${Math.round(shares[i] * 100)}%)</small>`).join(" · ");
}
function wordsText(d) {
  const tier = d.wordTier || "по умолч.";
  const r = d.wordDifficulty || [0, 1];
  return r[0] === 0 && r[1] === 1 ? tier : `${tier} · ${r[0]}–${r[1]}`;
}
function rewardText(r) {
  if (!r) return "—";
  const item = r.item ? ` «${ITEM_NAMES[r.item] || r.item}»` : "";
  return r.kind === "Coins" ? `${r.amount} монет` : r.kind === "InfiniteLives" ? `Жизни ∞ ${r.amount} мин` : `${REWARD_NAMES[r.kind] || r.kind}${item} × ${r.amount}`;
}

const handle = (kind, attrs) => `<div class="handle" data-drag="${kind}" ${attrs} title="Перетащите, чтобы переставить">⠿</div>`;

function rowHtml(L) {

  </div>`;
}

function unlockHtml(u) {
  const used = new Set(unlocks().filter((x) => x !== u).map((x) => x.feature));
  const options = (S.state.features || []).map((f) =>
    `<option value="${esc(f.feature)}" ${f.feature === u.feature ? "selected" : ""} ${used.has(f.feature) ? "disabled" : ""}>${esc(f.title)}${used.has(f.feature) ? " — уже есть" : ""}</option>`).join("");
  const tutorials = tutorialChoices().map((t) => (t.value === "None" ? { ...t, title: "без обучения" } : t));
  const tid = `tut-U-${u.feature}`;
  const tutHint = tutorials.find((t) => t.value === u.tutorial)?.hint || "Обучение на уровне открытия";
  const beyond = u.level > levelCount() ? ' <span class="muted">(такого уровня ещё нет)</span>' : "";
  const help = choiceList(tid, tutorials, u.tutorial);
  return `<div class="line unlock seq" data-seq="unlock" data-feature="${esc(u.feature)}" id="unlock-${esc(u.feature)}">
    ${handle("unlock", `data-feature="${esc(u.feature)}"`)}
    <span>🔓 Открывается</span>
    <select data-action="unlock-feature" data-feature="${esc(u.feature)}" title="Какая способность">${options}</select>
    <span class="what">с уровня ${u.level}</span>${beyond}
    <select id="${esc(tid)}" data-action="unlock-tutorial" data-feature="${esc(u.feature)}" title="${esc(tutHint)}">${choiceOptions(tutorials, u.tutorial)}</select>${helpBtn(tid)}
    <span class="spacer"></span>
    <span class="mv"><button data-action="unlock-up" data-feature="${esc(u.feature)}" ${u.level > 1 ? "" : "disabled"} title="На уровень раньше">↑</button><button data-action="unlock-down" data-feature="${esc(u.feature)}" ${u.level <= levelCount() ? "" : "disabled"} title="На уровень позже">↓</button></span>
    <button class="small danger" data-action="unlock-delete" data-feature="${esc(u.feature)}" title="Убрать открытие">✕</button>
  </div>${help ? `<div class="line-help">${help}</div>` : ""}`;
}

function bonusHtml(b) {
  const n = b.afterLevel;
  const open = S.open.has("B" + n);
  const rewards = b.rewards || [];
  const stars = (S.state.starsPerLevel || 3) * n;
  const preview = rewards.slice(0, 3).map(rewardText).join(", ") + (rewards.length > 3 ? "…" : "");
  const count = levelCount();
  let html = `<div class="line bonus seq ${open ? "open" : ""}" data-seq="bonus" data-n="${n}" data-action="toggle-bonus" id="bonus-${n}">
    ${handle("bonus", `data-n="${n}"`)}
    <span class="what">🎁 Бонусный уровень</span><span>после уровня ${n} · игрок берёт ${b.picks} из ${rewards.length} · открывается за ${stars} ★</span>
    <span class="muted">${esc(preview)}</span>
    <span class="spacer"></span>
    <span class="mv"><button data-action="bonus-up" data-n="${n}" ${n > 1 ? "" : "disabled"} title="Выше">↑</button><button data-action="bonus-down" data-n="${n}" ${n < count ? "" : "disabled"} title="Ниже">↓</button></span>
  </div>`;
  if (open) html += bonusEditorHtml(b);
  return html;
}

function bonusEditorHtml(b) {
  const n = b.afterLevel;
  const slots = rewardSlots();
  const kinds = S.state.rewards?.kinds || Object.keys(REWARD_NAMES);
  const cards = [];
  for (let i = 0; i < slots; i++) {
    const r = b.rewards[i];
    if (!r) { cards.push(`<div class="reward empty" data-slot="${i}" data-bonus="${n}"><button class="small" data-action="reward-add" data-n="${n}">+ Награда</button></div>`); continue; }
    const items = r.kind === "Booster" ? S.state.rewards?.boosters : r.kind === "Helper" ? S.state.rewards?.helpers : null;
    const at = `data-n="${n}" data-slot="${i}"`;
    cards.push(`<div class="reward" data-slot="${i}" data-bonus="${n}">
      <div class="reward-head">${handle("reward", at)}<span>Клетка ${i + 1}</span><span class="spacer"></span>
        <button class="small" data-action="reward-left" ${at} ${i > 0 ? "" : "disabled"} title="Раньше">←</button>
        <button class="small" data-action="reward-right" ${at} ${i < b.rewards.length - 1 ? "" : "disabled"} title="Позже">→</button>
        <button class="small danger" data-action="reward-delete" ${at} title="Убрать награду">✕</button></div>
      <select data-action="reward-kind" ${at}>${kinds.map((k) => `<option value="${k}" ${k === r.kind ? "selected" : ""}>${REWARD_NAMES[k] || k}</option>`).join("")}</select>
      ${items ? `<select data-action="reward-item" ${at}>${items.map((it) => `<option value="${it}" ${it === r.item ? "selected" : ""}>${esc(ITEM_NAMES[it] || it)}</option>`).join("")}</select>` : ""}
      <label class="f auto"><span>${REWARD_UNITS[r.kind] || "сколько"}</span><input type="number" min="1" data-action="reward-amount" ${at} data-key="B${n}:r${i}" value="${r.amount}" style="width:90px"></label>
    </div>`);
  }
  return `<div class="editor" id="editor-B${n}">
    <div class="toolbar" style="margin-top:0">
      <span><b>Бонусный уровень после уровня ${n}</b> — не игровой уровень: игрок выбирает награды из ${slots} клеток.</span>
      <span class="spacer"></span>
      <label class="f auto" style="margin:0"><span>Игрок берёт</span><input type="number" min="1" max="${slots}" data-action="bonus-picks" data-n="${n}" data-key="B${n}:picks" value="${b.picks}" style="width:70px"></label>
    </div>
    <div class="rewards">${cards.join("")}</div>
    <div class="toolbar"><span class="muted">Награды переставляются перетаскиванием ⠿ или ← →.</span><span class="spacer"></span>
      <button class="danger" data-action="bonus-delete" data-n="${n}">Убрать бонусный уровень</button></div>
  </div>`;
}

function field(L, label, bind, type, opts = {}) {
  const v = get(L.draft, bind);
  const attrs = `data-l="${L.key}" data-bind="${bind}" data-type="${type}" data-key="${L.key}:${bind}"`;
  let input;
  if (type === "select") input = `<select ${attrs}>${opts.options.map(([val, name]) => `<option value="${esc(val)}" ${String(val) === String(v ?? "") ? "selected" : ""}>${esc(name)}</option>`).join("")}</select>`;
  else if (type === "words") input = `<input ${attrs} value="${esc((v || []).join(", "))}" placeholder="STAR, BOOK">`;
  else input = `<input ${attrs} type="${type === "str" ? "text" : "number"}" ${opts.step ? `step="${opts.step}"` : ""} ${opts.min !== undefined ? `min="${opts.min}"` : ""} ${opts.max !== undefined ? `max="${opts.max}"` : ""} value="${esc(v)}">`;
  return `<label class="f ${opts.wide ? "wide" : ""}"><span>${label}${opts.hint ? `<small>${esc(opts.hint)}</small>` : ""}</span>${input}</label>`;
}

function inputOnly(L, bind, type, opts = {}) {
  const v = get(L.draft, bind);
  return `<input data-l="${L.key}" data-bind="${bind}" data-type="${type}" data-key="${L.key}:${bind}" type="${type === "str" ? "text" : "number"}" ${opts.step ? `step="${opts.step}"` : ""} ${opts.min !== undefined ? `min="${opts.min}"` : ""} ${opts.max !== undefined ? `max="${opts.max}"` : ""} value="${esc(v)}" ${opts.title ? `title="${esc(opts.title)}"` : ""}>`;
}

function taskHtml(L, si, ti, t) {
  const base = `subLevels.${si}.tasks.${ti}`;
  const ids = `data-l="${L.key}" data-sub="${si}" data-task="${ti}"`;
  const remove = `<button class="small danger" data-action="del-task" ${ids} title="Удалить задание">✕</button>`;
  if (t.asset !== undefined) {
    return `<div class="task"><div class="asset"><span class="chip">ассет</span>${esc(t.name || "(пусто)")}</div>
      <div class="asset">${esc(describeTask(t))} <small class="muted">— настройки в ассете задания</small>
        ${t.type ? `<button class="small" data-action="unlink-asset" ${ids}>Сделать заданием уровня</button>` : ""}</div>${remove}</div>`;
  }
  const pid = `task-${L.key}-${si}-${ti}`;
  const choices = taskChoices();
  const select = `<div class="task-pick"><div class="pick-row"><select id="${pid}" data-action="task-type" ${ids} data-key="${L.key}:${base}.type">
      <option value="" ${!t.type ? "selected" : ""}>— тип задания —</option>
      ${choiceOptions(choices, t.type)}</select>${helpBtn(pid)}</div>${hintHtml(choices, t.type)}</div>`;
  const tt = taskType(t.type);
  let fields = "";
  if (tt) {
    fields = tt.fields.map((f) => {
      const bind = `${base}.settings.${f.name}`;
      const label = FIELD_LABELS[f.name] || f.label;
      const tip = esc(f.tooltip || "");
      let control;
      if (f.kind === "vector2int" || f.kind === "vector2") {
        const step = f.kind === "vector2" ? "0.01" : "1";
        const kind = f.kind === "vector2" ? "float" : "int";
        control = `<div class="pair">${inputOnly(L, bind + ".x", kind, { step, title: "от" })}${inputOnly(L, bind + ".y", kind, { step, title: "до" })}</div>`;
      } else if (f.kind === "bool") {
        control = `<input type="checkbox" data-l="${L.key}" data-bind="${bind}" data-type="bool" data-key="${L.key}:${bind}" ${get(L.draft, bind) ? "checked" : ""} style="width:auto">`;
      } else if (f.kind === "enum") {
        const v = get(L.draft, bind);
        control = `<select data-l="${L.key}" data-bind="${bind}" data-type="int" data-key="${L.key}:${bind}">${f.options.map((o) => `<option value="${o.value}" ${o.value === v ? "selected" : ""}>${esc(o.name)}</option>`).join("")}</select>`;
      } else {
        control = inputOnly(L, bind, f.kind === "string" ? "str" : f.kind, { step: f.kind === "float" ? "0.01" : undefined, min: f.min });
      }
      return `<label title="${tip}">${esc(label)}${control}</label>`;
    }).join("");
  }
  return `<div class="task">${select}<div class="task-fields">${fields}</div>${remove}${choiceList(pid, choices, t.type)}</div>`;
}
