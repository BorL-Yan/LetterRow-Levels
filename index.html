      <button data-action="move-to" data-l="${L.key}">Переместить</button>
    </div>
    ${notes.length ? `<div class="notes">${notes.join("")}</div>` : ""}
    <div class="paths">${esc(L.file || "")}${d.config ? " · " + esc(d.config) : ""}${d.prefab ? " · " + esc(d.prefab) : ""}</div>
  </div>`;
}

function visible(L) {
  if (S.filter === "hard") return !!L.draft?.hard;
  if (S.filter === "issues") return (L.issues || []).length > 0 || !!L.conflict || !!L.error;
  return true;
}

// Лента: открытия «с уровня N» — над уровнем N, бонусный уровень «после N» — под ним; всё, что дальше последнего, — в конце.
function render() {
  if (!S.state) return;
  const active = document.activeElement;
  const focus = active?.dataset?.key;
  const sel = focus && active.selectionStart != null ? [active.selectionStart, active.selectionEnd] : null;
  const list = regular();
  const last = list.length ? list[list.length - 1].n : 0;
  const all = S.filter === "all";
  let html = `<div class="legend"><span><i style="background:var(--hard)"></i>сложный уровень</span><span><i style="background:var(--unlock)"></i>открытие способности</span><span><i style="background:var(--blevel)"></i>бонусный уровень</span><span>⠿ — перетащить</span><span>⧉ — задание-ассет</span></div>`;
  if (S.playing) html += `<div class="banner">Unity в Play Mode: ассеты меняются сразу, префабы — после выхода из Play Mode.</div>`;
  if (S.prog?.conflict) html += `<div class="banner err">Открытия и бонусные уровни изменены в Unity, пока здесь были правки.
    <button class="small" data-action="take-unity" data-l="P">Взять из Unity</button> <button class="small" data-action="overwrite" data-l="P">Перезаписать моими</button></div>`;
  if (S.prog?.error) html += `<div class="banner err">${esc(S.prog.error)}</div>`;
  for (const m of S.prog?.messages || []) html += `<div class="banner">${esc(m)}</div>`;
  const mapCount = S.state.levelCount;
  if (mapCount && last > mapCount) html += `<div class="banner">На карте меню ${mapCount} уровней (MenuMapConfig → Level Count), уровни после ${mapCount} на ней не видны.</div>`;
  const progStatus = S.prog && S.prog.status !== "saved" ? ` · открытия и бонусы: <span class="state ${S.prog.status}">${STATUS_TEXT[S.prog.status] || S.prog.status}</span>` : "";
  html += `<div class="table"><div class="row head"><div></div><div>№</div><div>Тип</div><div class="c hide-s">Подур.</div><div class="hide-s">Задачи</div><div class="hide-s">Слова</div><div class="c hide-s">Ходы</div><div class="c hide-s">★1 / ★2 / ★3</div><div class="c hide-s">Монеты</div><div class="c hide-s">Объекты</div><div>Статус${progStatus}</div></div>`;
  const byLevel = (n) => unlocks().filter((u) => u.level === n);
  let shown = 0;
  for (const L of list) {
    if (all) for (const u of byLevel(L.n)) html += unlockHtml(u);
    if (visible(L)) {
      shown++;
      html += rowHtml(L);
      if (S.open.has(L.key)) html += editorHtml(L);
    }
    const b = bonusAt(L.n);
    if (all && b) html += bonusHtml(b);
  }
  if (all) {
    for (const u of unlocks().filter((u) => u.level > last).sort((a, b) => a.level - b.level)) html += unlockHtml(u);
    for (const b of bonuses().filter((b) => b.afterLevel > last)) html += bonusHtml(b);
  }
  if (!shown) html += `<div class="empty">${list.length ? "Нет уровней под фильтр" : "Уровней нет — нажмите «+ Уровень»"}</div>`;
  html += `</div>`;
  app.innerHTML = html;
  if (focus) {
    const el = app.querySelector(`[data-key="${CSS.escape(focus)}"]`);
    if (el) { el.focus(); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch {} }
  }
}

function updateRow(L) {
  const row = document.getElementById(`row-${L.key}`);
  if (row) row.outerHTML = rowHtml(L);
}

// ───────────────────────── перетаскивание ─────────────────────────
// Строка ленты: уровень — на место среди уровней (Unity переименует), открытие — «с уровня» ниже места,
// бонусный уровень — «после уровня» выше места. Награда — в другую клетку своего бонусного уровня.
function clearDrop() { app.querySelectorAll(".drop-before, .drop-after, .reward.drop").forEach((e) => e.classList.remove("drop-before", "drop-after", "drop")); }

// Место в ленте: индекс промежутка перед строкой rows[i] (rows.length — в конце).
function gapAt(y) {
  const rows = [...app.querySelectorAll(".seq")];
  for (let i = 0; i < rows.length; i++) {
    const r = rows[i].getBoundingClientRect();
    if (y < r.top + r.height / 2) return { rows, i };
  }
  return { rows, i: rows.length };
}

// Перетаскивание указателем (мышь, тачпад, палец): нажали ⠿ — тянем — отпустили.
app.addEventListener("pointerdown", (e) => {
  const h = e.target.closest?.("[data-drag]");
  if (!h || e.button > 0) return;
  e.preventDefault();
  const kind = h.dataset.drag;
  S.drag = { kind, n: +h.dataset.n, feature: h.dataset.feature, slot: +h.dataset.slot, y0: e.clientY, x0: e.clientX, active: false,
             row: h.closest(kind === "reward" ? ".reward" : ".seq") };
  h.setPointerCapture?.(e.pointerId);
});
app.addEventListener("pointermove", (e) => {
  const d = S.drag;
  if (!d) return;
  if (!d.active) {
    if (Math.abs(e.clientY - d.y0) + Math.abs(e.clientX - d.x0) < 5) return;
    d.active = true;
    d.row?.classList.add("dragging");
    document.body.classList.add("dragging-now");
  }
  clearDrop();
  if (d.kind === "reward") {
    const card = document.elementFromPoint(e.clientX, e.clientY)?.closest(".reward");
    if (card && +card.dataset.bonus === d.n) card.classList.add("drop");
    return;
  }
  const { rows, i } = gapAt(e.clientY);
  if (i < rows.length) rows[i].classList.add("drop-before"); else if (rows.length) rows[rows.length - 1].classList.add("drop-after");
});
function endDrag(e, cancel) {
  const d = S.drag;
  if (!d) return;
  d.row?.classList.remove("dragging");
  document.body.classList.remove("dragging-now");
  if (!d.active || cancel) { S.drag = null; clearDrop(); return; }
  const target = document.elementFromPoint(e.clientX, e.clientY) || app;
  dropAt(d, target, e.clientY);
}
app.addEventListener("pointerup", (e) => endDrag(e, false));
app.addEventListener("pointercancel", (e) => endDrag(e, true));

// Отпустили перетаскиваемое в точке y (над элементом target).
function dropAt(d, target, y) {
  S.drag = null;
  clearDrop();
  if (d.kind === "reward") {
    const card = target.closest(".reward");
    if (!card || +card.dataset.bonus !== d.n) return;
    const b = bonusAt(d.n);
    const to = Math.min(+card.dataset.slot, b.rewards.length - 1);
    if (to === d.slot) return;
    editProg(() => { const [r] = b.rewards.splice(d.slot, 1); b.rewards.splice(to, 0, r); });
    return;
  }
  const { rows, i } = gapAt(y);
  const levelsBefore = rows.slice(0, i).filter((r) => r.dataset.seq === "level");
  const levelsAfter = rows.slice(i).filter((r) => r.dataset.seq === "level");
  if (d.kind === "level") {
    const before = levelsBefore.filter((r) => +r.dataset.n !== d.n).length;
    moveLevel(d.n, before + 1);
  } else if (d.kind === "unlock") {
    moveUnlock(d.feature, levelsAfter.length ? +levelsAfter[0].dataset.n : levelCount() + 1);
  } else if (d.kind === "bonus") {
    if (!levelsBefore.length) { toast("Бонусный уровень стоит после уровня — перетащите его ниже уровня 1", true); return; }
    moveBonus(d.n, +levelsBefore[levelsBefore.length - 1].dataset.n);
  }
}

// ───────────────────────── правки ─────────────────────────
function get(obj, path) { return path.split(".").reduce((o, k) => (o == null ? undefined : o[k]), obj); }
function set(obj, path, value) {
  const keys = path.split(".");
  let o = obj;
  for (let i = 0; i < keys.length - 1; i++) {
    if (o[keys[i]] == null) o[keys[i]] = /^\d+$/.test(keys[i + 1]) ? [] : {};
    o = o[keys[i]];
  }
  o[keys[keys.length - 1]] = value;
}

function readValue(el) {
  const t = el.dataset.type;
  if (t === "bool") return el.checked;
  if (t === "int") { const v = parseInt(el.value, 10); return Number.isFinite(v) ? v : 0; }
  if (t === "float") { const v = parseFloat(String(el.value).replace(",", ".")); return Number.isFinite(v) ? v : 0; }
  if (t === "words") return el.value.split(/[,;\s]+/).map((w) => w.trim().toUpperCase()).filter(Boolean);
  return el.value;
}

function onEdit(e, structural) {
  const el = e.target.closest("[data-bind]");
  if (!el) return;
  const L = S.levels.get(el.dataset.l);
  if (!L || !L.draft) return;
  set(L.draft, el.dataset.bind, readValue(el));
  markDirty(L);
  if (structural) render();
  else {
    updateRow(L);
    const preview = document.getElementById(`stars-${L.key}`);
    if (preview) preview.innerHTML = starsPreview(L.draft);
  }
}

// Поля развития игры (открытия, награды): числа — без перерисовки, пока печатаешь; списки — с перерисовкой.
function onProgEdit(el, typing) {
  const a = el.dataset.action;
  const b = el.dataset.n ? bonusAt(+el.dataset.n) : null;
  const slot = +el.dataset.slot;
  const u = el.dataset.feature ? unlocks().find((x) => x.feature === el.dataset.feature) : null;
  const num = () => Math.max(1, parseInt(el.value, 10) || 1);
  switch (a) {
    case "bonus-picks": b.picks = Math.min(num(), rewardSlots()); break;
    case "reward-amount": b.rewards[slot].amount = num(); break;
    case "reward-kind": {
      const r = b.rewards[slot];
      r.kind = el.value;
      r.item = r.kind === "Booster" ? (S.state.rewards?.boosters || [""])[0] : r.kind === "Helper" ? (S.state.rewards?.helpers || [""])[0] : "";
      r.amount = r.kind === "Coins" ? 100 : r.kind === "InfiniteLives" ? 30 : 1;
      break;
    }
    case "reward-item": b.rewards[slot].item = el.value; break;
    case "unlock-feature": {
      const f = featureInfo(el.value);
      Object.assign(u, { feature: el.value, title: f?.title || el.value, tutorial: f?.tutorial || "None", showOnMap: f?.showOnMap ?? true });
      break;
    }
    case "unlock-tutorial": u.tutorial = el.value; break;
    default: return false;
  }
  markDirty(S.prog);
  if (!typing) render();
  return true;
}

app.addEventListener("input", (e) => {
  if (e.target.tagName === "SELECT" || e.target.type === "checkbox") return;
  if (e.target.dataset.action && onProgEdit(e.target, true)) return;
  onEdit(e, false);
});
app.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.action === "task-type") {
    const L = S.levels.get(el.dataset.l);
    const tasks = L.draft.subLevels[+el.dataset.sub].tasks;
    const tt = taskType(el.value);
    tasks[+el.dataset.task] = tt ? { type: tt.type, settings: clone(tt.defaults) } : { type: "" };
    markDirty(L); render();
    return;
  }
  if (el.dataset.action && el.tagName === "SELECT" && onProgEdit(el, false)) return;
  if (el.dataset.action === "bonus-picks" || el.dataset.action === "reward-amount") { render(); return; }
  if (el.dataset.bind) onEdit(e, true);
});

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (!el || el.tagName === "SELECT" || el.tagName === "INPUT" || el.disabled) return;
  if (e.target.closest("input, select, textarea, .handle") && (el.dataset.action === "toggle" || el.dataset.action === "toggle-bonus")) return;
  const L = el.dataset.l ? (el.dataset.l === "P" ? S.prog : S.levels.get(el.dataset.l)) : null;
  const n = el.dataset.n ? +el.dataset.n : null;
  const slot = +el.dataset.slot;
  const a = el.dataset.action;
  const b = n != null ? bonusAt(n) : null;
  switch (a) {
    case "toggle": S.open.has(L.key) ? S.open.delete(L.key) : S.open.add(L.key); render(); return;
    case "toggle-bonus": S.open.has("B" + n) ? S.open.delete("B" + n) : S.open.add("B" + n); render(); return;
    case "filter":
      S.filter = el.dataset.filter;
      document.querySelectorAll("#filters button").forEach((x) => x.classList.toggle("on", x === el));
      render(); return;
    case "collapse": S.open.clear(); render(); return;
    case "help": {
      const id = el.dataset.help;
      S.help.has(id) ? S.help.delete(id) : S.help.add(id);
      render(); return;
    }
    case "pick": {
      // Вариант из списка «?» — как выбор в самом списке: тот же обработчик change.
      const sel = document.getElementById(el.dataset.target);
      S.help.delete(el.dataset.target);
      if (sel && sel.value !== el.dataset.value) { sel.value = el.dataset.value; sel.dispatchEvent(new Event("change", { bubbles: true })); }
      else render();
      return;
    }
    case "add-level": insertLevel(levelCount()); return;
    case "add-bonus": addBonus(); return;
    case "add-unlock": addUnlock(); return;
    case "insert-after": insertLevel(n); return;
    case "level-up": moveLevel(n, n - 1); return;
    case "level-down": moveLevel(n, n + 1); return;
    case "move-to": {
      const to = parseInt(document.getElementById(`moveto-${L.key}`).value, 10);
      if (Number.isFinite(to)) moveLevel(L.n, Math.min(Math.max(to, 1), levelCount()));
      return;
    }
    case "unlock-up": case "unlock-down": {
      const u = unlocks().find((x) => x.feature === el.dataset.feature);
      moveUnlock(u.feature, u.level + (a === "unlock-up" ? -1 : 1));
      return;
    }
    case "unlock-delete": editProg((d) => { d.unlocks = d.unlocks.filter((x) => x.feature !== el.dataset.feature); }); return;
    case "bonus-up": case "bonus-down": {
      // Через занятые места — к ближайшему свободному.
      const step = a === "bonus-up" ? -1 : 1;
      let to = n + step;
      while (to >= 1 && to <= levelCount() && bonusAt(to)) to += step;
      if (to < 1 || to > levelCount()) { toast("Дальше некуда", true); return; }
      moveBonus(n, to);
      return;
    }
    case "bonus-delete":
      if (!confirm(`Убрать бонусный уровень после уровня ${n}?`)) return;
      S.open.delete("B" + n);
      editProg((d) => { d.bonusLevels = d.bonusLevels.filter((x) => x.afterLevel !== n); });
      return;
    case "reward-add": editProg(() => { b.rewards.push({ kind: "Coins", item: "", amount: 100 }); }); return;
    case "reward-delete": editProg(() => { b.rewards.splice(slot, 1); b.picks = Math.min(b.picks, Math.max(1, b.rewards.length)); }); return;
    case "reward-left": case "reward-right": {
      const to = slot + (a === "reward-left" ? -1 : 1);
      editProg(() => { const [r] = b.rewards.splice(slot, 1); b.rewards.splice(to, 0, r); });
      return;
    }
    case "take-unity":
      L.draft = clone(L.conflict.data); L.server = L.conflict.data; L.hash = L.conflict.hash;
      L.conflict = null; L.dirty = false; L.status = "saved"; clearTimeout(L.timer); render(); return;
    case "overwrite": save(L, true); return;
    case "gh-pull": ghRun("/api/github/pull"); return;
    case "gh-push": ghRun("/api/github/push"); return;
    case "gh-resolve": ghRun("/api/github/resolve", { key: el.dataset.key, choice: el.dataset.choice }); return;
    case "gh-settings": GH.form = !GH.form; renderGhForm(); return;
    case "gh-save": ghSaveSettings(); return;
    case "lang": I18N.set(I18N.lang === "ru" ? "en" : "ru"); return;
    case "reload-page": flushSaves().finally(() => location.reload()); return;
  }
  if (!L || !L.draft || L.kind !== "level") return;
  const d = L.draft;
  const si = +el.dataset.sub, ti = +el.dataset.task;
  switch (a) {
    case "set-hard": d.hard = el.dataset.value === "1"; break;
    case "add-sub": d.subLevels.push({ id: "", order: "Together", tasks: [] }); break;
    case "del-sub":
      if (!confirm(`Удалить подуровень ${si + 1}? В префабе он удалится вместе с цепью и доской (Unity спросит ещё раз).`)) return;
      d.subLevels.splice(si, 1); break;
    case "add-task": {
      const first = (S.state.taskTypes || [])[0];
      d.subLevels[si].tasks.push(first ? { type: first.type, settings: clone(first.defaults) } : { type: "" });
      break;
    }
    case "del-task": d.subLevels[si].tasks.splice(ti, 1); break;
    case "unlink-asset": {
      const t = d.subLevels[si].tasks[ti];
      const tasks = d.subLevels[si].tasks;
      tasks.splice(ti, 1);
      // Задания уровня идут раньше заданий-ассетов — новое встаёт после последнего задания уровня.
      const at = tasks.findIndex((x) => x.asset !== undefined);
      tasks.splice(at < 0 ? tasks.length : at, 0, { type: t.type, settings: clone(t.settings || taskType(t.type)?.defaults || {}) });
      break;
    }
    default: return;
  }
  markDirty(L); render();
});

// ───────────────────────── GitHub (LevelEditorSync_Plan.md §5–6) ─────────────────────────
// С Unity: получает и отправляет Unity, страница показывает состояние, запускает и решает конфликты.
// Без Unity (телефон): то же самое делает Local ниже, прямо с GitHub.
const GH = { status: null, running: false, form: false };
const ghEl = document.getElementById("gh");
ghEl.innerHTML = `<div id="gh-main" style="display:grid;gap:8px"></div><div id="gh-form"></div>`;
const ghMain = document.getElementById("gh-main");
const ghForm = document.getElementById("gh-form");

function renderGitHub() {
  const s = GH.status;
  if (!s) { ghEl.hidden = true; return; }
  ghEl.hidden = false;
  const settingsBtn = s.standalone ? `<button data-action="gh-settings">Настройки</button>` : "";
  if (!s.configured) {
    ghMain.innerHTML = s.standalone
      ? `<div class="gh-bar"><b>GitHub</b><span class="muted">не настроен — нужен токен</span><span class="spacer"></span>${settingsBtn}</div>`
      : `<div class="gh-bar"><span class="muted">GitHub не настроен — в Unity: Tools → Levels → GitHub → Настройки и конфликты</span></div>`;
    if (s.standalone && !GH.form) { GH.form = true; renderGhForm(); }
    return;
  }
  const pending = s.pending || [];
  const conflicts = s.conflicts || [];
  const busy = s.busy || GH.running;
  let html = `<div class="gh-bar"><b>GitHub</b><a href="${esc(s.repoUrl)}" target="_blank" rel="noopener">${esc(s.repo)}</a>
    <span class="muted">${s.lastSync ? "синхронизация " + esc(s.lastSync) : "ещё не синхронизировано"}</span>
    <span class="${pending.length ? "pending" : "muted"}">${pending.length ? "не отправлено: " + pending.length : "всё отправлено"}</span>
    <span class="spacer"></span>
    ${busy ? `<span class="state saving">${esc(s.busyText || "синхронизация…")}</span>` : ""}
    ${settingsBtn}
    <button data-action="gh-pull" ${busy ? "disabled" : ""}>Получить</button>
    <button class="primary" data-action="gh-push" ${busy || conflicts.length ? "disabled" : ""} title="${conflicts.length ? "Сначала разберите конфликты" : "Все правки — одним коммитом"}">Отправить</button>`;
  if (pending.length) html += `<details><summary>что не отправлено</summary>${pending.map(esc).join(" · ")}</details>`;
  if (s.standalone && s.hasSchema === false) html += `<div class="banner" style="width:100%;margin:0">Нет справочников (типы заданий, способности) — нажмите «Получить». Если не помогло — отправьте уровни из Unity.</div>`;
  if (s.error && !busy) html += `<div class="banner err" style="width:100%;margin:0">${esc(s.error)}</div>`;
  if (s.statusError) html += `<div class="banner" style="width:100%;margin:0">${esc(s.statusError)}</div>`;
  html += `</div>`;
  for (const c of conflicts) {
    html += `<div class="gh-conflict"><b>Конфликт · ${esc(c.title)}</b> — изменено и здесь, и на GitHub
      <ul>${(c.diff || []).map((d) => `<li>${esc(d)}</li>`).join("")}</ul>
      <div class="muted">строки: здесь → на GitHub · пока не решено, здесь своя версия</div>
      <div class="toolbar"><button class="small" data-action="gh-resolve" data-key="${esc(c.key)}" data-choice="remote" ${busy ? "disabled" : ""}>Взять с GitHub</button>
      <button class="small" data-action="gh-resolve" data-key="${esc(c.key)}" data-choice="local" ${busy ? "disabled" : ""}>${c.localDeleted ? "Оставить удалённым" : "Оставить мои"}</button></div></div>`;
  }
  ghMain.innerHTML = html;
}

// Настройки телефона: рисуются только по кнопке (опрос состояния их не перерисовывает — не стирает ввод).
function renderGhForm() {
  const s = GH.status || {};
  if (!GH.form) { ghForm.innerHTML = ""; return; }
  ghForm.innerHTML = `<div class="gh-bar" style="display:grid;gap:8px">
    <b>Настройки GitHub</b>
    <label class="f"><span>Владелец</span><input id="gh-owner" value="${esc(s.owner || "")}" autocapitalize="off" autocomplete="off"></label>
    <label class="f"><span>Репозиторий</span><input id="gh-repo" value="${esc(s.repoName || "")}" autocapitalize="off" autocomplete="off"></label>
    <label class="f"><span>Ветка</span><input id="gh-branch" value="${esc(s.branch || "main")}" autocapitalize="off" autocomplete="off"></label>
    <label class="f"><span>Токен<small>Fine-grained: только этот репозиторий, Contents — Read and write</small></span>
      <input id="gh-token" type="password" autocomplete="off" placeholder="${s.hasToken ? "сохранён — пусто, чтобы оставить" : "github_pat_…"}"></label>
    <details><summary class="muted">Для проверки</summary><label class="f"><span>Адрес API</span><input id="gh-api" value="${esc(s.apiUrl || "")}" placeholder="https://api.github.com" autocapitalize="off"></label></details>
    <div class="toolbar" style="margin:0"><button class="primary" data-action="gh-save">Сохранить</button>
      ${s.configured ? `<button data-action="gh-settings">Закрыть</button>` : ""}
      <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">Как сделать токен</a></div>
    <div class="muted">Токен хранится только в этом браузере на этом устройстве.</div></div>`;
}

async function ghSaveSettings() {
  const v = (id) => document.getElementById(id).value.trim();
  const body = { owner: v("gh-owner"), repo: v("gh-repo"), branch: v("gh-branch") || "main", apiUrl: v("gh-api") };
  if (v("gh-token")) body.token = v("gh-token");
  const r = await api("POST", "/api/github/settings", body);
  if (!r.ok) { toast(r.body.error || "не сохранено", true); return; }
  GH.status = r.body;
  GH.form = !r.body.configured;
  renderGhForm(); renderGitHub();
  if (r.body.configured) ghRun("/api/github/pull");
}

async function ghStatus() {
  try {
    const r = await api("GET", "/api/github/status");
    if (r.ok) GH.status = r.body;
  } catch { /* Unity не отвечает — полоса как была */ }
  renderGitHub();
  return GH.status;
}

async function ghPoll() {
  if (!GH.running) await ghStatus();
  setTimeout(ghPoll, 4000);
}

// Запустить и ждать конца: Unity (или Local) переписывает файлы — страница потом читает всё заново.
async function ghRun(url, body) {
  if (GH.running || S.busyOp) return;
  if (!(await flushSaves())) { toast("Сначала разберите конфликт или ошибку сохранения", true); return; }
  GH.running = true; S.busyOp = true;
  if (GH.status) GH.status.busyText = url.endsWith("push") ? "Отправляю на GitHub…" : url.endsWith("pull") ? "Получаю с GitHub…" : "…";
  renderGitHub();
  try {
    const r = await api("POST", url, body || {});
    if (!r.ok) { toast(r.body.error || `ошибка ${r.status}`, true); return; }
    GH.status = r.body;
    while (GH.status?.busy) {
      renderGitHub();
      await new Promise((res) => setTimeout(res, 1000));
      await ghStatus();
    }
    const s = GH.status || {};
    if (s.error) toast(s.error, true);
    else if (s.message) toast(s.message);
  } catch { toast(STANDALONE ? "Ошибка синхронизации" : "Нет связи с Unity", true); if (!STANDALONE) setOnline(false); }
  finally {
    GH.running = false; S.busyOp = false;
    await loadState().catch(() => {});
    renderGitHub();
  }
}

// ───────────────────────── без Unity: синхронизация (порт LevelSyncCore.cs, LevelEditorSync_Plan.md §5–6) ─────────────────────────
class SyncError extends Error { constructor(status, message) { super(message); this.status = status; } }

const Sync = {
  LEVEL: /^Level_(\d+)\.json$/i,
  PROG: "Progression.json",
  // Номер и то, что выводит Unity (пути ассета и префаба меняются при перестановке, звёзды — из очков), — не правка.
  DERIVED: ["level", "prefab", "config", "stars"],
  LABELS: {
    steps: "Ходов", coins: "Монет за победу", threeStarScore: "Очки на 3 звезды", stars: "Звёзды", startObjects: "Объектов на старте",
    stones: "Из них камней", maxObjects: "Лимит объектов", wordTier: "Сложность", wordDifficulty: "Сложность слов",
    startWords: "Стартовые слова", tutorial: "Обучение", tutorialWord: "Слово обучения", hard: "Сложный", order: "Порядок заданий",
    subLevels: "подуровень", tasks: "задание", settings: "", _points: "Очки", _text: "Текст", _letter: "Буква", _times: "Сколько раз",
    _letters: "Букв в слове", _words: "Сколько слов", _stones: "Сколько камней", _minOnScene: "На сцене не меньше",
    _maxOnScene: "На сцене не больше", _wordsOnScene: "Готовых слов на сцене", type: "Тип", unlocks: "открытие",
    bonusLevels: "бонусный уровень", rewards: "награда", level: "С уровня", afterLevel: "После уровня", picks: "Берёт наград",
    amount: "Сколько", kind: "Вид", item: "Что", feature: "Способность", title: "Название", showOnMap: "На карте",
  },

  num(name) { const m = Sync.LEVEL.exec(name || ""); return m ? +m[1] : 0; },
  fileName(n) { return `Level_${String(n).padStart(2, "0")}.json`; },
  toText(o) { return JSON.stringify(o, null, 2) + "\n"; },
  isProg(name) { return (name || "").toLowerCase() === "progression.json"; },
  newId() {
    if (crypto.randomUUID) return crypto.randomUUID().replace(/-/g, "");
    return Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, "0")).join("");
  },
  async sha1(bytes) {
    const h = await crypto.subtle.digest("SHA-1", bytes);
    return Array.from(new Uint8Array(h), (b) => b.toString(16).padStart(2, "0")).join("");
  },
  // SHA файла в git — как в дереве GitHub.
  async blobSha(text) {
    const body = new TextEncoder().encode(text);
    const head = new TextEncoder().encode(`blob ${body.length}\0`);
    const all = new Uint8Array(head.length + body.length);
    all.set(head); all.set(body, head.length);
    return Sync.sha1(all);
  },
  canon(v) {
    if (v === null || v === undefined) return "null";
    if (Array.isArray(v)) return "[" + v.map(Sync.canon).join(",") + "]";
    if (typeof v === "object") return "{" + Object.keys(v).sort().map((k) => JSON.stringify(k) + ":" + Sync.canon(v[k])).join(",") + "}";
    return JSON.stringify(v);
  },
  async contentHash(o) {
    const c = { ...o };
    for (const k of Sync.DERIVED) delete c[k];
    return Sync.sha1(new TextEncoder().encode(Sync.canon(c)));
  },

  // Папка «имя → текст» → уровни по ID, порядок, Progression.json.
  async read(files) {
    const f = { byId: new Map(), order: [], prog: null, progHash: null };
    for (const name of Object.keys(files).sort((a, b) => Sync.num(a) - Sync.num(b))) {
      if (Sync.isProg(name)) { f.prog = JSON.parse(files[name]); f.progHash = await Sync.contentHash(f.prog); continue; }
      const n = Sync.num(name);
      if (n <= 0) continue;
      const json = JSON.parse(files[name]);
      if (!json.id) throw new Error(`${name}: нет "id"`);
      if (f.byId.has(json.id)) throw new Error(`${name}: такой же "id", как у другого файла`);
      f.byId.set(json.id, { id: json.id, number: n, hash: await Sync.contentHash(json), json });
      f.order.push(json.id);
    }
    return f;
  },

  async localChanges(base, files) {
    const local = await Sync.read(files);
    const changes = [];
    for (const id of local.order) {
      const l = local.byId.get(id);
      if (!(id in base.levels)) changes.push(`уровень ${l.number} (новый)`);
      else if (base.levels[id] !== l.hash) changes.push(`уровень ${l.number}`);
    }
    const deleted = Object.keys(base.levels).filter((id) => !local.byId.has(id)).length;
    if (deleted) changes.push(`удалено уровней: ${deleted}`);
    const inBase = new Set(base.order);
    const a = local.order.filter((id) => inBase.has(id)), b = base.order.filter((id) => local.byId.has(id));
    if (a.join() !== b.join()) changes.push("порядок уровней");
    if (local.progHash && local.progHash !== base.progression) changes.push("открытия и бонусные уровни");
    return changes;
  },

  async readRemote(api, base, tree, messages) {
    const f = { byId: new Map(), order: [], prog: null, progHash: null };
    const levels = [];
    for (const e of tree) {
      if (e.type !== "blob" || !e.path.startsWith("data/")) continue;
      const name = e.path.slice(5);
      if (name === Sync.PROG) { f.prog = JSON.parse(await api.blob(e.sha)); f.progHash = await Sync.contentHash(f.prog); continue; }
      const n = Sync.num(name);
      if (n <= 0) continue;
      const L = { number: n, sha: e.sha, json: null };
      const known = base.blobs[e.sha];
      if (known && known.id) { L.id = known.id; L.hash = known.hash; }
      else { L.json = JSON.parse(await api.blob(e.sha)); L.id = L.json.id; L.hash = await Sync.contentHash(L.json); }
      levels.push(L);
    }
    levels.sort((a, b) => a.number - b.number);
    for (const L of levels) {
      if (!L.id || f.byId.has(L.id)) {
        await Sync.ensureJson(api, L);
        L.id = Sync.newId(); L.json.id = L.id; L.hash = await Sync.contentHash(L.json); L.sha = null;
        messages.push(`на GitHub у ${Sync.fileName(L.number)} не было своего ID — он новый уровень`);
      }
      f.byId.set(L.id, L); f.order.push(L.id);
    }
    return f;
  },

  async ensureJson(api, L) { if (!L.json) L.json = JSON.parse(await api.blob(L.sha)); },

  // §5.2: изменено только там — взять; только здесь — оставить; по-разному с двух сторон — конфликт.
  async pull(api, base, files) {
    const head = await api.head();
    if (head === base.commit) return { upToDate: true, base, taken: [], messages: [] };
    const local = await Sync.read(files);
    const tree = await api.tree(await api.commitTree(head));
    const messages = [], taken = [];
    const remote = await Sync.readRemote(api, base, tree, messages);
    const nb = clone(base);
    nb.commit = head; nb.conflicts = []; nb.blobs = {};
    for (const r of remote.byId.values()) if (r.sha) nb.blobs[r.sha] = { id: r.id, hash: r.hash };

    const final = new Map();
    const ids = [...local.order, ...remote.order.filter((id) => !local.byId.has(id))];
    for (const id of Object.keys(base.levels)) if (!ids.includes(id)) ids.push(id);
    for (const id of ids) {
      const b = id in base.levels ? base.levels[id] : null;
      const l = local.byId.get(id), r = remote.byId.get(id);
      const lh = l ? l.hash : null, rh = r ? r.hash : null;
      if (rh === b) { if (l) final.set(id, l.json); continue; }
      if (!r) {
        if (l) { final.set(id, l.json); messages.push(`уровень ${l.number} удалён на GitHub — здесь остался (удалить можно в Unity)`); }
        delete nb.levels[id];
        continue;
      }
      await Sync.ensureJson(api, r);
      if (lh === b) { final.set(id, r.json); nb.levels[id] = rh; taken.push(b == null ? `уровень ${r.number} (новый)` : `уровень ${r.number}`); continue; }
      if (lh === rh) { final.set(id, l.json); nb.levels[id] = rh; continue; }
      nb.conflicts.push({ key: id, title: `Уровень ${l ? l.number : r.number}`, remoteHash: rh, remote: r.json, remoteNumber: r.number,
        localDeleted: !l, diff: l ? Sync.diff(l.json, r.json) : ["здесь удалён, на GitHub изменён"] });
      if (l) final.set(id, l.json);
    }

    let prog = local.prog;
    const pb = base.progression ?? null, plh = local.progHash, prh = remote.progHash;
    if (prh && prh !== pb) {
      if (plh === pb || !plh) { prog = remote.prog; nb.progression = prh; taken.push("открытия и бонусные уровни"); }
      else if (plh === prh) nb.progression = prh;
      else nb.conflicts.push({ key: "progression", title: "Открытия и бонусные уровни", remoteHash: prh, remote: remote.prog,
        diff: Sync.diff(local.prog, remote.prog) });
    }

    const merged = Sync.mergeOrder(base.order, local.order, remote.order, final);
    if (merged.conflict) {
      nb.order = base.order;
      nb.conflicts.push({ key: "order", title: "Порядок уровней", remoteOrder: remote.order, diff: Sync.orderDiff(local, remote) });
    } else {
      nb.order = remote.order;
      const mine = merged.order.filter((id) => local.byId.has(id)).join(), was = local.order.filter((id) => final.has(id)).join();
      if (mine !== was) taken.push("порядок уровней");
    }

    // Справочники (типы заданий, способности) — их выгружает Unity.
    let schema = null;
    const se = tree.find((e) => e.type === "blob" && e.path === "data/schema.json");
    if (se && se.sha !== base.schemaSha) { schema = JSON.parse(await api.blob(se.sha)); nb.schemaSha = se.sha; }

    return { upToDate: false, files: Sync.build(merged.order, final, prog), base: nb, taken, messages, schema };
  },

  // Общие уровни — в порядке той стороны, что его меняла; новые — после своего соседа сверху.
  mergeOrder(baseOrder, localOrder, remoteOrder, final) {
    const inB = new Set(baseOrder), inL = new Set(localOrder), inR = new Set(remoteOrder);
    const common = (id) => inB.has(id) && inL.has(id) && inR.has(id) && final.has(id);
    const b = baseOrder.filter(common).join(), l = localOrder.filter(common), r = remoteOrder.filter(common);
    let order, conflict = false;
    if (l.join() === r.join() || r.join() === b) order = l;
    else if (l.join() === b) order = r;
    else { order = l; conflict = true; }
    order = [...order];
    Sync.place(order, localOrder, final);
    Sync.place(order, remoteOrder, final);
    for (const id of final.keys()) if (!order.includes(id)) order.push(id);
    return { order, conflict };
  },

  place(order, source, wanted) {
    source.forEach((id, i) => {
      if (!wanted.has(id) || order.includes(id)) return;
      let at = 0;
      for (let j = i - 1; j >= 0; j--) { const k = order.indexOf(source[j]); if (k >= 0) { at = k + 1; break; } }
      order.splice(at, 0, id);
    });
  },

  orderDiff(local, remote) {
    const lines = [];
    for (const id of local.order) {
      const r = remote.byId.get(id);
      if (r && r.number !== local.byId.get(id).number) lines.push(`уровень ${local.byId.get(id).number} здесь — ${r.number} на GitHub`);
    }
    return Sync.cut(lines);
  },

  build(order, levels, prog) {
    const files = {};
    order.forEach((id, i) => {
      const json = clone(levels.get(id));
      files[Sync.fileName(i + 1)] = Sync.toText("level" in json ? Object.assign(json, { level: i + 1 }) : { level: i + 1, ...json });
    });
    if (prog) files[Sync.PROG] = Sync.toText(prog);
    return files;
  },

  // §5.3 на телефоне: что отправлять, решает база (содержимое и место уровня), а не текст файла — запись чисел
  // у Unity и браузера разная (0.0 / 0), из-за неё файлы не гоняются туда-сюда.
  async push(api, base, files) {
    if (base.conflicts.length) throw new Error("Сначала разберите конфликты — что оставить, здесь или на GitHub");
    const head = await api.head();
    if (head !== base.commit) return { needPull: true };
    const local = await Sync.read(files);
    const treeSha = await api.commitTree(head);
    const tree = await api.tree(treeSha);
    const remote = new Map(tree.filter((e) => e.type === "blob" && e.path.startsWith("data/")).map((e) => [e.path, e.sha]));
    const entries = [], sent = new Set();
    local.order.forEach((id, i) => {
      const l = local.byId.get(id), path = "data/" + Sync.fileName(i + 1);
      if (base.order[i] === id && base.levels[id] === l.hash && remote.has(path)) return;
      entries.push({ path, mode: "100644", type: "blob", content: files[Sync.fileName(l.number)] });
      sent.add(id);
    });
    for (const path of remote.keys()) if (Sync.num(path.slice(5)) > local.order.length) entries.push({ path, mode: "100644", type: "blob", sha: null });
    if (local.prog && local.progHash !== base.progression) entries.push({ path: "data/" + Sync.PROG, mode: "100644", type: "blob", content: files[Sync.PROG] });

    let commit = head, message = null;
    if (entries.length) {
      message = Sync.commitMessage("Телефон", base, local);
      const newTree = await api.createTree(treeSha, entries);
      commit = await api.createCommit(message, newTree, head);
      if (!(await api.moveBranch(commit))) return { needPull: true };
    }
    const nb = clone(base);
    nb.commit = commit; nb.conflicts = [];
    nb.levels = {}; nb.blobs = {};
    for (const [i, id] of local.order.entries()) {
      const l = local.byId.get(id);
      nb.levels[id] = l.hash;
      const sha = sent.has(id) ? await Sync.blobSha(files[Sync.fileName(l.number)]) : remote.get("data/" + Sync.fileName(i + 1));
      if (sha) nb.blobs[sha] = { id, hash: l.hash };
    }
    nb.order = [...local.order];
    nb.progression = local.progHash;
    return { needPull: false, nothing: !entries.length, message, base: nb };
  },

  commitMessage(author, base, local) {
    const levels = [];
    for (const id of local.order) {
      const l = local.byId.get(id);
      if (!(id in base.levels)) levels.push(`${l.number} (новый)`);
      else if (base.levels[id] !== l.hash) levels.push(String(l.number));
    }
    const parts = [];
    if (levels.length) parts.push((levels.length === 1 ? "уровень " : "уровни ") + levels.join(", "));
    const inBase = new Set(base.order);
    if (local.order.filter((id) => inBase.has(id)).join() !== base.order.filter((id) => local.byId.has(id)).join()) parts.push("порядок уровней");
    if (local.progHash && local.progHash !== base.progression) parts.push("открытия и бонусные уровни");
    return `${author}: ${parts.length ? parts.join("; ") : "файлы"}`;
  },

  // Конфликт без сети: remote — версия GitHub сюда; local — своё уйдёт при «Отправить». Возвращает файлы или null.
  async resolve(base, files, key, choice) {
    const c = base.conflicts.find((x) => x.key === key);
    if (!c) throw new Error("Такого конфликта уже нет");
    const remote = choice === "remote";
    base.conflicts = base.conflicts.filter((x) => x !== c);
    const local = await Sync.read(files);
    const levels = new Map([...local.byId].map(([id, l]) => [id, l.json]));
    let order = [...local.order], prog = local.prog;
    if (key === "order") {
      base.order = c.remoteOrder || [];
      if (!remote) return null;
      const inLocal = new Set(order);
      const merged = base.order.filter((id) => inLocal.has(id));
      Sync.place(merged, order, levels);
      order = merged;
    } else if (key === "progression") {
      base.progression = c.remoteHash;
      if (!remote) return null;
      prog = c.remote;
    } else {
      if (c.remoteHash) base.levels[key] = c.remoteHash; else delete base.levels[key];
      if (!remote || !c.remote) return null;
      levels.set(key, c.remote);
      if (!order.includes(key)) order.splice(Math.max(0, Math.min((c.remoteNumber || 1) - 1, order.length)), 0, key);
    }
    return Sync.build(order, levels, prog);
  },

  // Различия по полям «поле: здесь → GitHub».
  diff(mine, theirs) {
    const a = clone(mine || {}), b = clone(theirs || {});
    for (const k of [...Sync.DERIVED, "id"]) { delete a[k]; delete b[k]; }
    const lines = [];
    Sync.diffTok("", a, b, lines);
    return Sync.cut(lines);
  },
  diffTok(path, a, b, lines) {
    const obj = (v) => v !== null && typeof v === "object" && !Array.isArray(v);
    if (obj(a) && obj(b)) {
      for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) {
        const label = k in Sync.LABELS ? Sync.LABELS[k] : k;
        Sync.diffTok(!label ? path : path ? `${path} · ${label}` : label, a[k], b[k], lines);
      }
      return;
    }
    if (Array.isArray(a) && Array.isArray(b) && (a.some(obj) || b.some(obj))) {
      for (let i = 0; i < Math.max(a.length, b.length); i++) Sync.diffTok(`${path} ${i + 1}`, a[i], b[i], lines);
      return;
    }
    const va = Sync.show(a), vb = Sync.show(b);
    if (va !== vb) lines.push(`${path || "значение"}: ${va} → ${vb}`);
  },
  show(v) {
    if (v === undefined) return "нет";
    if (v !== null && typeof v === "object" && !Array.isArray(v)) return "есть";
    let t;
    if (Array.isArray(v) && v.every((x) => x === null || typeof x !== "object")) t = v.map((x) => (typeof x === "string" ? x : Sync.canon(x))).join(", ");
    else if (typeof v === "string") t = `«${v}»`;
    else t = Sync.canon(v);
    return t.length > 60 ? t.slice(0, 57) + "…" : t;
  },
  cut(lines) { return lines.length <= 12 ? lines : [...lines.slice(0, 12), `и ещё ${lines.length - 12}`]; },
};

// GitHub Git Data API из браузера (api.github.com разрешает CORS).
class GitHubApi {
  constructor(s) { this.s = s; }
  async send(method, path, body) {
    const base = (this.s.apiUrl || "https://api.github.com").replace(/\/$/, "");
    const url = `${base}/repos/${encodeURIComponent(this.s.owner)}/${encodeURIComponent(this.s.repo)}${path}`;
    const headers = { Accept: "application/vnd.github+json", Authorization: `Bearer ${this.s.token}` };
    if (body) headers["Content-Type"] = "application/json";
    let r;
    try { r = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined, cache: "no-store" }); }
    catch { throw new SyncError(0, "Нет связи с GitHub — проверьте интернет"); }
    let json = {};
    try { json = await r.json(); } catch { /* пустой ответ */ }
    if (!r.ok) throw new SyncError(r.status, this.explain(r.status, json.message));
    return json;
  }
  explain(status, message) {
    const repo = `${this.s.owner}/${this.s.repo}`;
    if (status === 401) return "GitHub не принял токен (401) — токен неверный или истёк";
    if (status === 403) return `Нет прав (403): токену нужен доступ к ${repo}, Contents — Read and write${message ? ` (${message})` : ""}`;
    if (status === 404) return `Не найдено (404): репозиторий ${repo} или ветка «${this.s.branch}» — или у токена нет к ним доступа`;
    if (status === 409) return `Репозиторий ${repo} пустой — создайте его с README`;
    return `GitHub ответил ${status}${message ? ": " + message : ""}`;
  }
  get branch() { return this.s.branch.split("/").map(encodeURIComponent).join("/"); }
  async head() { return (await this.send("GET", `/git/ref/heads/${this.branch}`)).object.sha; }
  async commitTree(sha) { return (await this.send("GET", `/git/commits/${sha}`)).tree.sha; }
  async tree(sha) {
    const j = await this.send("GET", `/git/trees/${sha}?recursive=1`);
    if (j.truncated) throw new SyncError(0, "GitHub отдал дерево не целиком");
    return j.tree || [];
  }
  async blob(sha) {
    const j = await this.send("GET", `/git/blobs/${sha}`);
    if (j.encoding !== "base64") return j.content;
    const bin = atob((j.content || "").replace(/\s/g, ""));
    return new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0)));
  }
  async createTree(baseTree, tree) { return (await this.send("POST", "/git/trees", { base_tree: baseTree, tree })).sha; }
  async createCommit(message, tree, parent) { return (await this.send("POST", "/git/commits", { message, tree, parents: [parent] })).sha; }
  async moveBranch(sha) {
    try { await this.send("PATCH", `/git/refs/heads/${this.branch}`, { sha, force: false }); return true; }
    catch (e) { if (e.status === 422 || e.status === 409) return false; throw e; }
  }
}

// ───────────────────────── без Unity: хранилище (IndexedDB) ─────────────────────────
const Store = {
  db: null, mem: {},
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open("level-editor", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("kv");
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    } catch { this.db = null; }
    for (const k of ["files", "base", "settings", "schema"]) this.mem[k] = await this.read(k);
    // Браузер не стирает данные сам, если попросить (важно для iPhone).
    try { await navigator.storage?.persist?.(); } catch { /* нет — ничего */ }
  },
  read(k) {
    if (!this.db) return Promise.resolve(undefined);
    return new Promise((res) => {
      const q = this.db.transaction("kv").objectStore("kv").get(k);
      q.onsuccess = () => res(q.result);
      q.onerror = () => res(undefined);
    });
  },
  get(k) { return this.mem[k]; },
  async set(k, v) {
    this.mem[k] = v;
    if (!this.db) return;
    await new Promise((res, rej) => {
      const tx = this.db.transaction("kv", "readwrite");
      tx.objectStore("kv").put(v, k);
      tx.oncomplete = res;
      tx.onerror = () => rej(tx.error);
    });
  },
};

// Проверки уровня, которым не нужен Unity (как LevelConfig.Validate без словаря).
function levelIssues(d) {
  const e = [];
  const subs = d.subLevels || [];
  if (!subs.length) e.push("нет подуровней");
  subs.forEach((s, i) => {
    if (!(s.tasks || []).length) e.push(`подуровень ${i + 1}: нет заданий`);
    else if (s.tasks.some((t) => !t.type)) e.push(`подуровень ${i + 1}: у задания в списке не выбран тип`);
  });
  const start = d.startObjects | 0, stones = d.stones | 0, max = d.maxObjects | 0;
  if (stones >= start) e.push(`камней ${stones} при ${start} объектах на старте — шаров на старте не будет`);
  if (max > 0 && stones >= max) e.push(`камней ${stones} при лимите объектов ${max} — шаров на старте не будет`);
  else if (max > 0 && start > max) e.push(`на старте ${start} объектов при лимите ${max} — стартовый бросок урежется до лимита (шаров меньше)`);
  const seen = new Set();
  let letters = 0;
  for (const raw of d.startWords || []) {
    const w = String(raw || "").trim().toUpperCase();
    if (w.length < 2) continue;
    if (seen.has(w)) e.push(`стартовое слово «${String(raw).trim()}» повторяется`);
    else { seen.add(w); letters += w.replace(/[^A-Z*]/g, "").length; }
  }
  const balls = Math.max(0, start - stones);
  const throwBalls = max > 0 ? Math.min(balls, Math.max(0, max - stones)) : balls;
  const plural = (n) => (n % 10 === 1 && n % 100 !== 11 ? "буква" : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? "буквы" : "букв");
  if (letters > throwBalls) e.push(`стартовые слова — ${letters} ${plural(letters)}, а шаров в стартовом броске ${throwBalls}: не все буквы будут на сцене сразу`);
  return e;
}

// ───────────────────────── без Unity: адреса /api/... внутри страницы ─────────────────────────
// Те же ответы, что у сервера Unity (LevelEditorServer.cs): страница не знает, с кем говорит.
const Local = {
  files: {},                 // имя → { text, hash }
  queue: Promise.resolve(),  // правки и синхронизация — по одной
  last: { message: null, error: null },

  async init() {
    await Store.open();
    this.files = Store.get("files") || {};
  },
  texts() { const o = {}; for (const [k, v] of Object.entries(this.files)) o[k] = v.text; return o; },
  async write(name, text) { this.files[name] = { text, hash: await Sync.blobSha(text) }; },
  persist() { return Store.set("files", this.files); },
  levelNames() { return Object.keys(this.files).filter((n) => Sync.num(n) > 0).sort((a, b) => Sync.num(a) - Sync.num(b)); },

  settings() {
    const s = Store.get("settings") || {};
    // На GitHub Pages адрес сам говорит, чей репозиторий: владелец.github.io/репозиторий/.
    const pages = /^([^.]+)\.github\.io$/i.exec(location.hostname);
    const repoGuess = pages ? location.pathname.split("/").filter(Boolean)[0] || "" : "";
    return { owner: s.owner ?? (pages ? pages[1] : ""), repo: s.repo ?? repoGuess, branch: s.branch || "main", token: s.token || "", apiUrl: s.apiUrl || "" };
  },
  configured(s) { return !!(s.owner && s.repo && s.branch && s.token); },
  base() {
    const s = this.settings();
    const key = `${s.owner}/${s.repo}@${s.branch}`;
    const b = Store.get("base");
    if (b && b.repo === key) return clone(b);
    return { repo: key, commit: null, levels: {}, order: [], progression: null, blobs: {}, conflicts: [], schemaSha: null };
  },

  entry(name) {
    const f = this.files[name];
    const data = JSON.parse(f.text);
    return { file: name, level: Sync.num(name), hash: f.hash, data, issues: Sync.num(name) > 0 ? levelIssues(data) : [] };
  },
  state() {
    const schema = Store.get("schema") || {};
    return {
      ...schema, project: "Телефон", playing: false, folder: "на этом устройстве", standalone: true,
      levels: this.levelNames().map((n) => this.entry(n)),
      progression: this.files[Sync.PROG] ? this.entry(Sync.PROG) : {},
    };
  },
  // Уровни по порядку → файлы Level_01…N (номера заново).
  async setLevels(datas) {
    for (const n of this.levelNames()) delete this.files[n];
    for (let i = 0; i < datas.length; i++) {
      const d = datas[i];
      await this.write(Sync.fileName(i + 1), Sync.toText("level" in d ? Object.assign(d, { level: i + 1 }) : { level: i + 1, ...d }));
    }
  },
  async putFile(name, body, check) {
    const cur = this.files[name]?.hash || null;
    if ((body.baseHash || null) !== cur) return [409, { error: "conflict", hash: cur, data: cur ? JSON.parse(this.files[name].text) : undefined }];
    const data = body.data;
    if (check) { const err = check(data); if (err) return [400, { error: err }]; }
    await this.write(name, Sync.toText(data));
    await this.persist();
    return [200, { ...this.entry(name), messages: [] }];
  },

  api(method, url, body) {
    const run = async () => {
      try {
        const [status, res] = await this.route(method, url, body || {});
        return { ok: status >= 200 && status < 300, status, body: res };
      } catch (e) {
        return { ok: false, status: e.status || 500, body: { error: e.message } };
      }
    };
    if (method === "GET") return run();
    const p = this.queue.then(run);
    this.queue = p.catch(() => {});
    return p;
  },

  async route(method, url, body) {
    if (method === "GET" && url === "/api/state") return [200, this.state()];
    if (method === "GET" && url === "/api/hashes") {
      const files = {};
      for (const [k, v] of Object.entries(this.files)) files[k] = v.hash;
      return [200, { files }];
    }
    if (method === "PUT" && url.startsWith("/api/level/")) {
      const n = +url.slice("/api/level/".length);
      if (!body.data?.id) body.data.id = Sync.newId();
      return this.putFile(Sync.fileName(n), body, (d) => (d.level !== n ? "data.level не совпадает с адресом" : null));
    }
    if (method === "PUT" && url === "/api/progression") return this.putFile(Sync.PROG, body);
    if (method === "POST" && url === "/api/move") {
      const datas = this.levelNames().map((n) => JSON.parse(this.files[n].text));
      const { from, to } = body;
      if (from < 1 || from > datas.length || to < 1 || to > datas.length) return [200, { ...this.state(), result: { error: `нет места: уровней ${datas.length}` } }];
      datas.splice(to - 1, 0, datas.splice(from - 1, 1)[0]);
      await this.setLevels(datas);
      await this.persist();
      return [200, { ...this.state(), result: { level: to, created: false, messages: [], error: null } }];
    }
    if (method === "POST" && url === "/api/insert") {
      const datas = this.levelNames().map((n) => JSON.parse(this.files[n].text));
      const after = Math.max(0, Math.min(body.after | 0, datas.length));
      const src = datas[after - 1] || datas[0];
      const d = src ? clone(src) : { subLevels: [{ id: "", order: "Together", tasks: [] }] };
      d.id = Sync.newId(); delete d.config; delete d.prefab;
      d.hard = false; d.tutorial = "None"; d.tutorialWord = "";
      for (const s of d.subLevels || []) s.id = "";
      datas.splice(after, 0, d);
      await this.setLevels(datas);
      await this.persist();
      return [200, { ...this.state(), result: { level: after + 1, created: true, error: null,
        messages: ["ассет и префаб уровня сделает Unity после «Получить»"] } }];
    }
    if (method === "POST" && url === "/api/export-all") return [200, this.state()];
    if (method === "GET" && url === "/api/github/status") return [200, await this.status()];
    if (method === "POST" && url === "/api/github/settings") {
      const old = Store.get("settings") || {};
      await Store.set("settings", { owner: body.owner, repo: body.repo, branch: body.branch || "main", apiUrl: body.apiUrl || "",
        token: body.token || old.token || "" });
      return [200, await this.status()];
    }
    if (method === "POST" && url.startsWith("/api/github/")) {
      this.last = { message: null, error: null };
      try {
        if (url === "/api/github/pull") this.last.message = await this.pull();
        else if (url === "/api/github/push") this.last.message = await this.push(0);
        else if (url === "/api/github/resolve") this.last.message = await this.resolve(body.key, body.choice);
        else return [404, { error: "нет такого адреса" }];
      } catch (e) {
        this.last.error = e.message;
      }
      return [200, await this.status()];
    }
    return [404, { error: "нет такого адреса" }];
  },

  api_() { const s = this.settings(); if (!this.configured(s)) throw new Error("GitHub не настроен — «Настройки»: владелец, репозиторий, токен"); return new GitHubApi(s); },

  async apply(files) {
    if (!files) return;
    for (const n of this.levelNames()) if (!(n in files)) delete this.files[n];
    for (const [n, text] of Object.entries(files)) if (this.files[n]?.text !== text) await this.write(n, text);
    await this.persist();
  },

  async pull() {
    const r = await Sync.pull(this.api_(), this.base(), this.texts());
    await this.apply(r.files);
    if (r.schema) await Store.set("schema", r.schema);
    const parts = [r.upToDate ? "на GitHub нового нет" : r.taken.length ? "взято: " + r.taken.join(", ") : "взять нечего", ...r.messages];
    if (r.base.conflicts.length) parts.push(`конфликтов: ${r.base.conflicts.length} — решите их выше`);
    r.base.lastSync = new Date().toLocaleString("ru-RU", { dateStyle: "short", timeStyle: "short" });
    await Store.set("base", r.base);
    return "Получено с GitHub: " + parts.join("; ");
  },

  async push(attempt) {
    const r = await Sync.push(this.api_(), this.base(), this.texts());
    if (r.needPull) {
      if (attempt >= 2) throw new Error("На GitHub всё время появляется новое — повторите позже");
      const got = await this.pull();
      if (this.base().conflicts.length) throw new Error(got + ". Отправка остановлена: разберите конфликты и отправьте снова");
      return this.push(attempt + 1);
    }
    r.base.lastSync = new Date().toLocaleString("ru-RU", { dateStyle: "short", timeStyle: "short" });
    r.base.schemaSha = this.base().schemaSha;
    await Store.set("base", r.base);
    return r.nothing ? "Нечего отправлять — на GitHub то же самое" : `Отправлено на GitHub: ${r.message}`;
  },

  async resolve(key, choice) {
    const base = this.base();
    const title = base.conflicts.find((c) => c.key === key)?.title || key;
    const files = await Sync.resolve(base, this.texts(), key, choice);
    await this.apply(files);
    await Store.set("base", base);
    return choice === "remote" ? `${title}: взята версия GitHub` : `${title}: оставлена своя — уйдёт при «Отправить»`;
  },

  async status() {
    const s = this.settings(), base = this.base();
    const st = {
      standalone: true, configured: this.configured(s), owner: s.owner, repoName: s.repo, branch: s.branch, apiUrl: s.apiUrl,
      hasToken: !!s.token, repo: `${s.owner}/${s.repo}`, repoUrl: `https://github.com/${s.owner}/${s.repo}`, busy: false,
      message: this.last.message, error: this.last.error, synced: !!base.commit, lastSync: base.lastSync || null,
      commit: base.commit ? base.commit.slice(0, 7) : null, hasSchema: !!Store.get("schema"),
      conflicts: base.conflicts.map((c) => ({ key: c.key, title: c.title, localDeleted: !!c.localDeleted, diff: c.diff || [] })),
      pending: [],
    };
    try { st.pending = await Sync.localChanges(base, this.texts()); } catch (e) { st.statusError = e.message; }
    return st;
  },
};

// ───────────────────────── старт ─────────────────────────
// Шапка таблицы прилипает под шапкой страницы — её высота зависит от ширины окна.
const syncHeader = () => document.documentElement.style.setProperty("--hdr", document.querySelector("header").offsetHeight + "px");
new ResizeObserver(syncHeader).observe(document.querySelector("header"));

// Без сети страница открывается из кэша service worker'а; вышла новая — он говорит «update», страница предлагает обновить.
function registerWorker() {
  if (!STANDALONE || !("serviceWorker" in navigator)) return;
  navigator.serviceWorker.onmessage = (e) => {
    if (e.data?.type !== "update" || document.getElementById("update-banner")) return;
    const el = document.createElement("div");
    el.id = "update-banner"; el.className = "toast";
    el.innerHTML = `Доступна новая версия страницы <button class="small primary" data-action="reload-page">Обновить</button>`;
    document.body.appendChild(el);
  };
  navigator.serviceWorker.register("sw.js").catch(() => { /* http не localhost или запрещено — без офлайна */ });
}

async function start() {
  if (STANDALONE) {
    registerWorker();
    await Local.init();
    document.title = "Уровни · телефон";
  }
  await loadState().catch(() => { setOnline(false); app.innerHTML = '<div class="empty">Нет связи с Unity. Откройте страницу из Unity: Tools → Levels → Open Level Editor.</div>'; });
  setTimeout(poll, 1500);
  await ghStatus();
  setTimeout(ghPoll, 4000);
  // Телефон: при открытии — свежие данные с GitHub, если здесь нет неотправленного (§5.4).
  const s = GH.status;
  if (STANDALONE && s?.configured && navigator.onLine !== false && !(s.pending || []).length && !(s.conflicts || []).length) ghRun("/api/github/pull");
}
start();
